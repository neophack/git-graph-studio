<!doctype html>
<html lang="en" class="vscode-dark">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Git Graph Studio</title>
	<link id="theme-css" rel="stylesheet" href="/theme/dark-modern.css" />
	<script src="/gitgraph/config.js"></script>
	<style>
		/* Paints before any module loads, so the window is never an empty dark rectangle.
		   Removed by the Workbench constructor once the shell's first frame is up.
		   Flat sci-fi: solid surfaces, 1-2px lines, one cyan accent, no gradients or
		   shadows. Colors are hardcoded on purpose - the theme css may not be parsed
		   yet when this paints, and the failure path in main.ts drops all children and
		   writes plain text into this container, so it must stay readable on its own.
		   The emblem is the git-graph-rs webview icon (vscode-git-graph-rs/resources/
		   git-graph-rs-webview-icon.svg, paths copied verbatim - the splash must be
		   self-contained before any module or asset loads), animated as the git story
		   it depicts, time flowing up from the bottom: the blue branch rises (its
		   commit pops, the grey tip caps it), the green commit reaches toward it -
		   just before the lines touch the blue ball drops away and vanishes, the
		   lines join, and a fresh merge ball is born at the junction; only then does
		   the continuous pink branch draw itself upward. Ferris drops onto the green
		   commit and idly bobs. */
		#boot-splash {
			--hud-bg: #0a0f16;
			--hud-accent: #35d6ff;
			--hud-text: #d8e4ef;
			--hud-muted: #64809a;
			--hud-line: rgba(53, 214, 255, 0.35);
			position: fixed;
			inset: 0;
			z-index: 999;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 18px;
			background: var(--hud-bg);
			color: var(--hud-text);
			font-family: system-ui, sans-serif;
			font-size: 13px;
		}
		/* HUD frame: four corner brackets, nothing more */
		#boot-splash .corner {
			position: absolute;
			width: 16px;
			height: 16px;
			border: 0 solid var(--hud-line);
		}
		#boot-splash .corner.tl { top: 14px; left: 14px; border-top-width: 2px; border-left-width: 2px; }
		#boot-splash .corner.tr { top: 14px; right: 14px; border-top-width: 2px; border-right-width: 2px; }
		#boot-splash .corner.bl { bottom: 14px; left: 14px; border-bottom-width: 2px; border-left-width: 2px; }
		#boot-splash .corner.br { bottom: 14px; right: 14px; border-bottom-width: 2px; border-right-width: 2px; }
		/* Emblem: the git-graph-rs logo acting out a merge. Branch segments grow
		   upward from the bottom (transform-origin at the fill-box bottom); the
		   green merge line grows right-to-left INTO the blue branch (origin at its
		   right edge); a beat before it lands the blue ball falls out of the graph
		   (boot-fall), and once the lines join a new ball pops in at the junction
		   (node-merged). The pink branch waits until after the merge. */
		#boot-splash .emblem {
			width: 84px;
			height: 84px;
		}
		#boot-splash .emblem .grow,
		#boot-splash .emblem .pop,
		#boot-splash .emblem .fall,
		#boot-splash .emblem .ferris,
		#boot-splash .emblem .ferris-bob {
			transform-box: fill-box;
			animation-fill-mode: both;
			animation-timing-function: ease-out;
		}
		#boot-splash .emblem .grow { animation-name: boot-grow; }
		#boot-splash .emblem .pop { transform-origin: center; animation-name: boot-pop; animation-duration: 0.3s; }
		/* history written upward: blue rises from the bottom, its commit pops, the
		   grey tip continues to the top */
		#boot-splash .emblem .seg-blue { transform-origin: 50% 100%; animation-duration: 0.35s; animation-delay: 0s; }
		#boot-splash .emblem .node-blue { animation-delay: 0.3s; }
		#boot-splash .emblem .seg-grey { transform-origin: 50% 100%; animation-duration: 0.35s; animation-delay: 0.45s; }
		/* the merge: green commit, then its line grows into blue; a beat before it
		   lands the blue ball drops out, and a fresh ball is born at the junction */
		#boot-splash .emblem .node-green { animation-delay: 0.95s; }
		#boot-splash .emblem .seg-green { transform-origin: 100% 50%; animation-name: boot-unfurl; animation-duration: 0.5s; animation-delay: 1.1s; }
		#boot-splash .emblem .fall { animation-name: boot-fall; animation-duration: 0.4s; animation-delay: 1.35s; animation-timing-function: ease-in; }
		#boot-splash .emblem .node-merged { animation-delay: 1.7s; }
		/* only after the lines have joined does the pink branch rise as one
		   continuous line, its commit popping at the top */
		#boot-splash .emblem .seg-pink { transform-origin: 50% 100%; animation-duration: 0.55s; animation-delay: 1.9s; }
		#boot-splash .emblem .node-pink { animation-delay: 2.4s; }
		#boot-splash .emblem .ferris {
			transform-origin: center;
			animation-name: boot-drop;
			animation-duration: 0.5s;
			animation-delay: 1.1s;
			animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
		}
		#boot-splash .emblem .ferris-bob {
			animation-name: boot-bob;
			animation-duration: 2.4s;
			animation-delay: 2s;
			animation-timing-function: ease-in-out;
			animation-iteration-count: infinite;
			animation-direction: alternate;
		}
		@keyframes boot-grow { from { transform: scaleY(0); } }
		@keyframes boot-unfurl { from { transform: scaleX(0); } }
		@keyframes boot-pop {
			0% { transform: scale(0); opacity: 0; }
			70% { transform: scale(1.18); opacity: 1; }
			100% { transform: scale(1); opacity: 1; }
		}
		@keyframes boot-fall {
			0% { transform: translateY(0); opacity: 1; }
			55% { transform: translateY(4px); opacity: 1; }
			100% { transform: translateY(10px); opacity: 0; }
		}
		@keyframes boot-drop {
			from { transform: translateY(-14px); opacity: 0; }
			to { transform: translateY(0); opacity: 1; }
		}
		@keyframes boot-bob { to { transform: translateY(-1.4px); } }
		/* Wordmark: monospace caps, wide tracking; Studio carries the accent */
		#boot-splash .wordmark {
			font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
			font-size: 15px;
			font-weight: 600;
			letter-spacing: 0.42em;
			padding-left: 0.42em; /* optically center against the trailing tracking */
			text-transform: uppercase;
			color: var(--hud-text);
		}
		#boot-splash .wordmark b { font-weight: 600; color: var(--hud-accent); }
		/* Scanner bar: a flat 2px track with a sliding segment */
		#boot-splash .track {
			position: relative;
			width: 168px;
			height: 2px;
			overflow: hidden;
			background: #14202c;
		}
		#boot-splash .track i {
			position: absolute;
			inset: 0 auto 0 0;
			width: 40px;
			background: var(--hud-accent);
			animation: boot-scan 1.4s ease-in-out infinite alternate;
		}
		@keyframes boot-scan { to { transform: translateX(128px); } }
		#boot-splash .boot-status {
			font-size: 11px;
			letter-spacing: 0.18em;
			text-transform: uppercase;
			color: var(--hud-muted);
		}
		@media (prefers-reduced-motion: reduce) {
			#boot-splash .emblem .grow,
			#boot-splash .emblem .pop,
			#boot-splash .emblem .fall,
			#boot-splash .emblem .ferris,
			#boot-splash .emblem .ferris-bob,
			#boot-splash .track i { animation: none; }
		}
	</style>
</head>
<body class="vscode-dark" data-vscode-theme-kind="vscode-dark">
	<div id="boot-splash" aria-label="Loading">
		<div class="corner tl"></div><div class="corner tr"></div>
		<div class="corner bl"></div><div class="corner br"></div>
		<svg class="emblem" viewBox="0 0 24 24" aria-hidden="true">
			<path class="grow seg-grey" style="fill:#808080" d="m 2.75,0 2.5,0 0,8.2 C 5.25,8.2 4.75,8 3.9779029,8 3.25,8.015175 2.75,8.203 2.75,8.2 z"/>
			<path class="grow seg-blue" style="fill:#0085d9" d="m 2.75,15.808 c 0,0 0.5,0.2 1.25,0.2 0.75,0 1.25,-0.2 1.25,-0.2 l 0,8.192 -2.5,0 z"/>
			<g class="grow seg-pink">
				<path style="fill:#d9008f" d="m 10.75,6.7964375 c 0,0 0.5,0.2 1.25,0.203125 0.750257,-8.355e-4 1.25,-0.203125 1.25,-0.203125 L 13.25,14.47 10.75,14 z"/>
				<path style="fill:#d9008f" d="m 10.75,18.52 2.5,0.46 0,5.02 -2.5,0 z"/>
			</g>
			<path class="grow seg-green" style="fill:#00d90a" d="M 5.140625,15.835938 C 5.23502,15.905738 5.143195,15.875148 6,16.25 c 1.7136032,0.749701 3.78125,1.09375 5.78125,1.46875 2,0.375 3.545654,0.571029 4.832051,1.133828 0.560272,-0.839749 1.263386,-1.390304 2.244583,-1.678078 C 18.667708,17.046412 18.856802,17.124851 18,16.75 c -1.713603,-0.749701 -3.78125,-1.09375 -5.78125,-1.46875 -2,-0.375 -3.5228672,-0.621464 -4.809264,-1.184263 -0.406834,0.63185 -1.0739799,1.382044 -2.268861,1.738951 z"/>
			<g class="pop node-blue"><g class="fall"><circle style="fill:#0085d9" cx="4" cy="12" r="3"/></g></g>
			<circle class="pop node-merged" style="fill:#0085d9" cx="4" cy="12" r="3"/>
			<circle class="pop node-pink" style="fill:#d9008f" cx="12" cy="3" r="3"/>
			<circle class="pop node-green" style="fill:#00d90a" cx="20" cy="21" r="3"/>
			<g class="ferris"><g class="ferris-bob"><g transform="translate(16.2 8.6) scale(0.78)">
				<path style="fill:none;stroke:#d63a00;stroke-width:1.1;stroke-linecap:round" d="M 3.1 3.5 L 1.8 2.6"/>
				<path style="fill:none;stroke:#d63a00;stroke-width:1.1;stroke-linecap:round" d="M 6.9 3.5 L 8.2 2.6"/>
				<path style="fill:none;stroke:#d63a00;stroke-width:1.1;stroke-linecap:round" d="M 1.9 5.7 L 0.7 6.7"/>
				<path style="fill:none;stroke:#d63a00;stroke-width:1.1;stroke-linecap:round" d="M 2.1 6.5 L 1.1 7.6"/>
				<path style="fill:none;stroke:#d63a00;stroke-width:1.1;stroke-linecap:round" d="M 8.1 5.7 L 9.3 6.7"/>
				<path style="fill:none;stroke:#d63a00;stroke-width:1.1;stroke-linecap:round" d="M 7.9 6.5 L 8.9 7.6"/>
				<circle cx="1.3" cy="2" r="1.45" fill="#f74c00"/>
				<circle cx="8.7" cy="2" r="1.45" fill="#f74c00"/>
				<ellipse cx="5" cy="4.9" rx="3.5" ry="2.7" fill="#f74c00"/>
				<circle cx="3.6" cy="3.05" r="0.82" fill="#ffffff"/>
				<circle cx="6.4" cy="3.05" r="0.82" fill="#ffffff"/>
				<circle cx="3.72" cy="3.16" r="0.4" fill="#20140f"/>
				<circle cx="6.28" cy="3.16" r="0.4" fill="#20140f"/>
			</g></g></g>
		</svg>
		<div class="wordmark">Git Graph <b>Studio</b></div>
		<div class="track"><i></i></div>
		<div class="boot-status">Loading Git Graph Studio…</div>
	</div>
	<div id="titlebar"></div>
	<div id="workbench">
		<div id="activitybar" role="toolbar" aria-label="Activity Bar"></div>
		<div id="sidebar" role="complementary"></div>
		<div id="sidebarSash" class="sash sash-vertical"></div>
		<div id="editorPart">
			<div id="editorGroup"></div>
			<div id="panelSash" class="sash sash-horizontal" hidden></div>
			<div id="panel" hidden></div>
		</div>
	</div>
	<div id="statusbar" role="status"></div>
	<div id="notifications" aria-live="polite"></div>
	<div id="overlays"></div>
	<script type="module" src="/src/main.ts"></script>
</body>
</html>
