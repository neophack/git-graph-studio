<!doctype html>
<!-- A dev-only page (served by `npm run dev` as /dev-harness.html; `vite build` only bundles
     index.html and ext-host.html, so this never ships) that runs the real workbench outside the
     main window's boot flow. It has two modes, and they differ in what they can prove:

     - Under `npm run dev` (tauri dev → http://localhost:5173/dev-harness.html) Tauri has already
       injected the real IPC bridge, so this page uses it: the real Rust backend, the real
       graph_request protocol, the real view.html - the exact pipeline the packaged app runs.
       This is the mode that can catch packaged-only regressions.
     - In a plain browser (vite serve, no Tauri) there is no IPC bridge, so a scripted fake
       backend stands in: enough repository data to open the Git Graph view, a diff and the pull
       / checkout actions. This mode only verifies frontend behaviour a jsdom test cannot (real
       layout, scrolling, the webview's Settings widget) - it says nothing about the backend.

     A banner at the top states which mode is active, so a green harness is never mistaken for
     an end-to-end pass when it ran against the mocks. -->
<html lang="en" class="vscode-dark">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Git Graph Studio - dev harness</title>
	<link rel="stylesheet" href="/theme/dark-modern.css" />
	<script src="/gitgraph/config.js"></script>
	<script>
		(function () {
			'use strict';

			/* ---------- The fake backend, for plain-browser sessions only ---------- */

			// A long file, so a diff of it must scroll.
			var lines = [];
			for (var i = 1; i <= 400; i++) lines.push('line ' + i + ' of the file');
			var oldText = lines.join('\n');
			var newText = lines.map(function (l, i) { return i % 50 === 0 ? 'CHANGED ' + l : l; }).join('\n');
			var commit = {
				hash: '0123456789abcdef0123456789abcdef01234567', parents: [],
				author: 'Dev Harness', email: 'dev@example.com', date: 1700000000000,
				message: 'initial commit', heads: ['main'], tags: [{ name: 'v1.0.0', annotated: true }], remotes: [], stash: null
			};

			function graphResponse(message) {
				switch (message.command) {
					case 'loadRepoInfo':
						return { command: 'loadRepoInfo', refreshId: message.refreshId, branches: ['main'], head: commit.hash,
							remotes: ['origin'], stashes: [], isRepo: true,
							operationState: { type: null, conflictedFiles: [], progress: null }, error: null };
					case 'loadCommits':
						// The deferred load the host now asks for: the page carries no "Uncommitted
						// Changes" row and says it is pending; the count case below completes it.
						return { command: 'loadCommits', refreshId: message.refreshId, commits: [commit], head: commit.hash,
							tags: ['v1.0.0'], moreCommitsAvailable: false, onlyFollowFirstParent: false, gerritStates: null, uncommittedPending: true, error: null };
					case 'countUncommittedChanges':
						return { command: 'countUncommittedChanges', count: 2, error: null };
					case 'loadConfig':
						return { command: 'loadConfig', repo: message.repo, config: {
							branches: { main: { pushRemote: null, remote: 'origin' } },
							authors: [{ name: 'Dev Harness', email: 'dev@example.com' }],
							diffTool: null, guiDiffTool: null, pushDefault: null,
							remotes: [{ name: 'origin', url: 'https://example.com/repo.git', pushUrl: null }],
							user: { name: { local: 'Dev Harness', global: null }, email: { local: 'dev@example.com', global: null } }
						}, error: null };
					default:
						return { command: message.command, error: null };
				}
			}

			var handlers = {
				'initial_repo': function () { return '/repo'; },
				'open_folder': function (args) { return { root: args && args.path ? args.path : '/repo', isRepo: true }; },
				'repo_head': function () { return { branch: 'main', shortHash: commit.hash.slice(0, 7), ahead: 0, behind: 3, upstream: 'origin/main' }; },
				'list_files': function () { return ['file.txt']; },
				'list_dir': function () { return [{ name: 'file.txt', path: '/repo/file.txt', isDir: false, size: 1000 }]; },
				'scm_status': function () { return [{ path: 'file.txt', oldPath: null, staged: null, unstaged: 'M', untracked: false }]; },
				'scm_branches': function () { return [
					{ name: 'main', remote: false, current: true, upstream: 'origin/main' },
					{ name: 'feature', remote: false, current: false, upstream: null },
					{ name: 'origin/main', remote: true, current: false, upstream: null }
				]; },
				'scm_remotes': function () { return [{ name: 'origin', url: 'https://example.com/repo.git' }]; },
				'scm_tags': function () { return ['v1.0.0']; },
				'scm_pull': function () { window.__harness.pulled++; return null; },
				'scm_checkout': function (args) { window.__harness.checkedOut.push(args.name); return null; },
				'read_file': function (args) { return { contents: oldText, binary: false, size: oldText.length }; },
					'read_file_at': function (args) { return { contents: args.revision === 'HEAD' ? oldText : newText, binary: false, size: oldText.length }; },
					// The open path probes before it reads; without these two a click on the
					// tree's file never mounts an editor in plain-browser mode.
					'file_probe': function () { return { size: oldText.length, binary: false, longLines: false }; },
					'read_file_raw': function () {
						var body = new TextEncoder().encode(oldText);
						var meta = new TextEncoder().encode(JSON.stringify({ binary: false, size: body.length, encoding: 'utf8', eol: 'lf' }));
						var out = new Uint8Array(8 + meta.length + body.length);
						new DataView(out.buffer).setBigUint64(0, BigInt(meta.length), true);
						out.set(meta, 8);
						out.set(body, 8 + meta.length);
						return out;
					},
				'graph_request': function (args) { return graphResponse(args.message); },
				'pty_create': function () { return 'mockshell'; },
				'pty_write': function (args) { window.__harness.typed.push(String(args.data)); return null; },
				'pty_kill': function () { return null; },
				'git_output_log': function () { return []; },
				'ext_list': function () { return []; },
				// The boot round trip the workbench opens with (a null answer here crashes
				// boot()'s context read — the plain-browser mode answers the plain launch).
				'boot_context': function () { return { file: null, actions: [], repo: null, opened: null, openedFor: null }; },
				'workspace_symbols': function () { return []; },
				'analysis_status': function () { return { state: 'idle' }; },
				'version': function () { return '0.1.5'; },
				'settings_read': function () { return null; },
				'keybindings_read': function () { return null; }
			};

			window.__harness = { pulled: 0, checkedOut: [], oldText: oldText, typed: [] };

			// Tauri injects its IPC bridge before any page script runs; if it is there we are
			// running under `tauri dev` and must NOT replace it - the whole point of the harness
			// in that mode is to exercise the real backend. The mocks below are for plain
			// browser sessions only.
			window.__harness.mocked = !window.__TAURI_INTERNALS__;
			if (window.__harness.mocked) {
				window.__TAURI_INTERNALS__ = {
					metadata: { currentWindow: { label: 'main' }, currentWebview: { label: 'main' } },
					invoke: function (command, args) {
						var handler = handlers[command];
						if (handler) return Promise.resolve(handler(args || {}));
						console.warn('[harness] unhandled invoke:', command, args);
						return Promise.resolve(null);
					},
					transformCallback: function (callback) { return Math.floor(Math.random() * 1e9); }
				};
			}

			// The mode banner: a green harness against the mocks proves nothing about the
			// packaged app, so the mode must always be visible.
			window.addEventListener('DOMContentLoaded', function () {
				var banner = document.createElement('div');
				banner.id = 'harness-mode';
				banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;pointer-events:none;' +
					'font:11px monospace;padding:2px 8px;color:#fff;background:' +
					(window.__harness.mocked ? '#a31515' : '#2e7d32') + '"';
				banner.textContent = window.__harness.mocked
					? 'DEV HARNESS - MOCKED BACKEND (plain browser): no real Rust backend is involved; frontend layout only'
					: 'DEV HARNESS - REAL BACKEND (tauri dev): the same Rust IPC pipeline as the packaged app';
					document.body.appendChild(banner);
					document.getElementById('titlebar').style.marginTop = '18px';
				});

			// Page errors and unhandled rejections, collected from the earliest moment so the
			// metrics report (and anyone driving the harness) sees what the console saw.
			window.__pageErrors = [];
			window.addEventListener('error', (event) => {
				window.__pageErrors.push(event.message + (event.filename ? ' @ ' + event.filename + ':' + event.lineno : ''));
			});
			window.addEventListener('unhandledrejection', (event) => {
				window.__pageErrors.push('rejection: ' + String(event.reason));
			});
			// CodeMirror reports plugin crashes through console.error - capture those too.
			const nativeError = console.error.bind(console);
			console.error = function () {
				window.__pageErrors.push('console.error: ' + Array.from(arguments).map((a) => (typeof a === 'string' ? a : String(a && a.message ? a.message : a))).join(' '));
				nativeError.apply(null, arguments);
			};
		})();
	</script>
</head>
<body class="vscode-dark" data-vscode-theme-kind="vscode-dark" data-vscode-theme-name="Dark Modern">
	<div id="titlebar"></div>
	<div id="workbench">
		<div id="activitybar" role="toolbar" aria-label="Activity Bar"></div>
		<div id="sidebar" role="complementary"></div>
		<div id="sidebarSash" class="sash sash-vertical"></div>
		<div id="editorPart">
			<div id="editorGroup"></div>
			<div id="panelSash" class="sash sash-horizontal" hidden></div>
			<div id="panel" hidden></div>
		</div>
	</div>
	<div id="statusbar" role="status"></div>
	<div id="notifications" aria-live="polite"></div>
	<div id="overlays"></div>
	<script type="module" src="/src/main.ts"></script>
	<script type="module">
		// The metrics mode (?metrics=1): the harness's second job - after the workbench
		// settles, drive the surfaces a measurement needs (a file open, a split, the find
		// widget), then measure the laid-out components and render the invariant report.
		// Automation reads window.__uiMetrics; a human sees the table and the console summary.
		if (new URLSearchParams(location.search).has('metrics')) {
			// A measurement needs a deterministic workbench: drop the previous session's
			// snapshot (it would restore its own tabs and splits) and boot once from clean
			// storage. The sessionStorage marker breaks the reload loop.
			if (!sessionStorage.getItem('ui-metrics-clean')) {
				sessionStorage.setItem('ui-metrics-clean', '1');
				localStorage.clear();
				location.reload();
			}
			const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
			const click = (element) => {
				for (const type of ['mousedown', 'mouseup', 'click']) {
					element.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true }));
				}
			};
			await sleep(1500); // the workbench boots and the first paint settles
			const fileRow = document.querySelector('.tree .row');
			if (fileRow) click(fileRow);
			await sleep(2000); // the editor chunk's first load is real wall-clock in a cold browser
			// The find widget opens in the FOCUSED group's editor - find before splitting.
			document.dispatchEvent(new KeyboardEvent('keydown', { key: 'f', ctrlKey: true, bubbles: true, cancelable: true }));
			await sleep(400);
			document.dispatchEvent(new KeyboardEvent('keydown', { key: '\\', ctrlKey: true, bubbles: true, cancelable: true }));
			await sleep(400);
			// A second chance: back to the file's group and find again (the first try can race
			// the editor chunk's cold load).
			document.dispatchEvent(new KeyboardEvent('keydown', { key: '1', ctrlKey: true, bubbles: true, cancelable: true }));
			await sleep(200);
			document.dispatchEvent(new KeyboardEvent('keydown', { key: 'f', ctrlKey: true, bubbles: true, cancelable: true }));
			await sleep(400);
			const { runUiMetrics } = await import('/src/uiMetrics.ts');
			const results = runUiMetrics();
			// Every shipped theme must keep its text readable: each theme is applied in turn
			// and its foreground/background token pairs measured as WCAG contrast ratios (the
			// user's theme is restored afterwards). Same jsdom caveat: real pass is here.
			const { runThemeContrastMetrics } = await import('/src/themeMetrics.ts');
			results.push(...await runThemeContrastMetrics());
			// Page errors are part of the report: a green measurement over a console full of
			// exceptions is not green.
			for (const error of window.__pageErrors || []) {
				results.push({ name: 'page error', status: 'fail', detail: error });
			}
			window.__uiMetrics = results;
			const failed = results.filter((r) => r.status === 'fail').length;
			console.table(results);
			console.log('[ui-metrics] ' + (results.length - failed) + ' pass, ' + failed + ' fail, ' + results.filter((r) => r.status === 'skipped').length + ' skipped');
			const panel = document.createElement('div');
			panel.id = 'ui-metrics';
			panel.style.cssText = 'position:fixed;left:8px;bottom:34px;z-index:9998;max-width:560px;max-height:60vh;overflow:auto;' +
				'font:11px monospace;color:#eee;background:rgba(20,20,20,0.95);border:1px solid #555;padding:8px;';
			panel.innerHTML = '<b>UI METRICS - ' + (failed === 0 ? 'ALL PASS' : failed + ' FAILING') + '</b>' +
				'<table style="border-collapse:collapse;margin-top:4px">' +
				results.map((r) => '<tr><td style="padding:1px 8px;color:' +
					(r.status === 'fail' ? '#f48771' : r.status === 'pass' ? '#73c991' : '#888') + '">' +
					r.status.toUpperCase() + '</td><td style="padding:1px 8px">' + r.name + '</td><td style="padding:1px 8px;color:#aaa">' + r.detail + '</td></tr>').join('') +
				'</table>';
			document.body.appendChild(panel);
			// The run itself writes a session snapshot (its splits); drop it so the NEXT
			// measurement boots clean instead of restoring this run's groups.
			localStorage.clear();
		}
	</script>
	<script type="module">
		// The scroll mode (?scroll=1): drive every scrolling surface - the code editor, the
		// windowed large-file editor, the indexed Fast Viewer, the hex view, the hex compare,
		// the CAN raw view - through the wheel and the page keys in real layout, and report
		// the amounts against the row model (scroll/, Zed's): a notch is the system's three
		// lines at sensitivity 1, Alt multiplies by the fast sensitivity, a page is the
		// viewport less one anchor row, the caret's fit keeps three rows of margin. The base
			// mock gains the viewer, indexed, chunk and CAN commands the surfaces need; the
			// surfaces themselves are opened through the real tree and the real tabs, except the
			// hex compare, the CAN raw view and the CAN statistics dashboard, which are
			// constructed directly (their launch UI is the folder compare's) so their models can
			// be read exactly.
		if (new URLSearchParams(location.search).has('scroll')) {
			// A clean boot per distinct query string: a re-run with a new ?run=N must not
			// inherit the previous run's restored session (its tabs reopen and race the
			// scenario's own opens).
			if (sessionStorage.getItem('scroll-clean') !== location.search) {
				sessionStorage.setItem('scroll-clean', location.search);
				localStorage.clear();
				location.reload();
			}
			const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
			const waitFor = async (ready, ms = 15000) => {
				const end = Date.now() + ms;
				while (Date.now() < end) {
					if (ready()) return true;
					await sleep(100);
				}
				return ready();
			};
			const click = (element) => {
				for (const type of ['mousedown', 'mouseup', 'click']) {
					element.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true }));
				}
			};
			const key = (element, k, mods = {}) => {
				const event = new KeyboardEvent('keydown', { key: k, code: k, bubbles: true, cancelable: true, ...mods });
				element.dispatchEvent(event);
				return event;
			};
			// Did a keydown reach the element, and was it already eaten on the way?
			const probeKey = (element, k, mods = {}) => {
				const seen = [];
				const mark = (phase) => (event) => seen.push(phase + (event.defaultPrevented ? ':prevented' : ''));
				element.addEventListener('keydown', mark('capture'), { capture: true, once: true });
				element.addEventListener('keydown', mark('at'), { once: true });
				const event = key(element, k, mods);
				return { seen, prevented: event.defaultPrevented };
			};
			// A dispatched notch must look like Chromium's real one: deltaY 100 px paired with
			// the legacy wheelDeltaY of -120 per notch. A constructed WheelEvent carries
			// wheelDeltaY = -3 x deltaY instead, which wheelToDelta's notch sniff rightly
			// reads as a trackpad - the app is correct, the synthetic event was not.
			const wheel = (element, deltaY, mods = {}) => {
				const event = new WheelEvent('wheel', { deltaY, deltaMode: 0, bubbles: true, cancelable: true, ...mods });
				Object.defineProperty(event, 'wheelDeltaY', { value: -Math.sign(deltaY) * 120 });
				element.dispatchEvent(event);
				return event;
			};
			const rect = (element) => element.getBoundingClientRect();
			// A scroll into rows the surface has not fetched yet lands a promise later; let a
			// couple of frames pass before measuring. The rAF is raced with a timer: a hidden
			// tab never fires animation frames, and the scenario must not hang on one.
			const settle = () => Promise.race([
				new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve))),
				sleep(150)
			]);
			const report = [];
			const check = (surface, name, expected, actual) => {
				const pass = typeof expected === 'function' ? expected(actual) : expected === actual;
				report.push({ surface, check: name, expected: typeof expected === 'function' ? 'see note' : String(expected), actual: String(actual), status: pass ? 'pass' : 'fail' });
			};

			/* ---------- the extended fake backend: what the base mock lacks ---------- */

			const HUGE_LINES = 300_000;
			const MONSTER_LINES = 60_000;
			const CAN_FRAMES = 20_000;
			const NAMES = ['file.txt', 'huge.txt', 'monster.js', 'blob.bin', 'trace.asc'];
			const hexLine = (n, tag) => 'line ' + n + ' of ' + tag;
			const chunkB64 = (path, offset, len) => {
				const name = String(path).split(/[\\/]/).pop();
				const size = name === 'l.bin' || name === 'r.bin' ? 64 * 1024 : 256 * 1024;
				const start = Math.min(Number(offset), size);
				const end = Math.min(start + Number(len), size);
				const bytes = new Uint8Array(Math.max(0, end - start));
				// The compare panes are all zero; the blob is a walking pattern so rows differ.
				for (let i = 0; i < bytes.length; i++) bytes[i] = name === 'blob.bin' ? (start + i) & 0xff : 0;
				let binary = '';
				for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
				return { size, base64: btoa(binary) };
			};
			const scrollHandlers = {
				list_files: () => NAMES,
				list_dir: () => NAMES.map((name) => ({ name, path: '/repo/' + name, isDir: false, size: 1000 })),
				file_probe: ({ path }) => {
					const name = String(path).split(/[\\/]/).pop();
					if (name === 'blob.bin') return { size: 256 * 1024, binary: true, longLines: false };
					if (name === 'monster.js') return { size: 40 * 1024 * 1024, binary: false, longLines: true };
					if (name === 'huge.txt') return { size: 300 * 1024 * 1024, binary: false, longLines: false };
					return { size: 1000, binary: false, longLines: false };
				},
				viewer_open: () => ({ docId: 1, lineCount: HUGE_LINES, language: 'log', syntaxName: 'Plain Text', symbols: [] }),
				viewer_text: ({ start, end }) => ({ startLine: Number(start), lineCount: HUGE_LINES, lines: Array.from({ length: Math.max(0, Number(end) - Number(start) + 1) }, (_, i) => hexLine(Number(start) + i + 1, 'huge')) }),
				viewer_edit: () => ({ lineCount: HUGE_LINES, rehighlightFrom: 0 }),
				viewer_reload: () => ({ changed: false, lineCount: HUGE_LINES }),
				viewer_save: () => null,
				viewer_close: () => null,
				viewer_backup: () => null,
				backup_clear: () => null,
				viewer_symbols: () => [],
				indexed_open: () => ({ docId: 2, lineCount: MONSTER_LINES, language: 'js', syntaxName: 'JavaScript', encoding: 'utf8', eol: 'lf' }),
				indexed_lines: ({ start, end }) => ({ startLine: Number(start), lineCount: MONSTER_LINES, tokensPending: false, lines: Array.from({ length: Math.max(0, (end === undefined ? Number(start) + 100 : Number(end) + 1) - Number(start)) }, (_, i) => ['monster line ' + (Number(start) + i), []]) }),
				read_file_chunk: ({ path, offset, len }) => chunkB64(path, offset, len),
				can_log_open: () => ({ docId: 22, totalBytes: 500_000 }),
				can_log_count: () => ({ parsed: CAN_FRAMES, done: true, error: null }),
				can_log_frames: ({ start, end }) => Array.from({ length: Math.max(0, Number(end) - Number(start)) }, (_, i) => ({ tS: (Number(start) + i) * 0.001, channel: 1, id: 0x100, extended: false, fd: false, brs: false, esi: false, remote: false, error: false, tx: false, dlc: 8, dataHex: '17' })),
				can_log_close: () => undefined,
				// The statistics dashboard's walk answer: two channels (one FD, its bits split
				// between the phases), the load timeline both charts draw, the payload histogram.
				can_log_stats: () => ({
					format: 'ASC', startTimestampS: 1_760_000_000, durationS: 10, totalFrames: 3500, errorFrames: 2,
					channels: [
						{ channel: 1, frames: 3000, errorFrames: 2, payloadBytes: 24000, arbBits: 56160, dataBits: 37440, firstS: 0, lastS: 10 },
						{ channel: 2, frames: 500, errorFrames: 0, payloadBytes: 6000, arbBits: 18720, dataBits: 0, firstS: 0, lastS: 10 }
					],
					messages: [
						{ channel: 1, id: 0x100, extended: false, fd: false, count: 1000, tx: 0, rx: 1000, payloadBytes: 8000, firstS: 0, lastS: 9.99, minCycleS: 0.01, maxCycleS: 0.01, avgCycleS: 0.01, stdCycleS: 0.0001 }
					],
					messagesTruncated: 0, skippedObjects: 0,
					loadProfiles: [
						{ channel: 1, buckets: Array.from({ length: 10 }, (_, i) => ({ tS: i, durS: 1, frames: 300, errors: 0, arbBits: i === 0 ? 11232 : 4992, dataBits: i === 0 ? 7488 : 3328 })) },
						{ channel: 2, buckets: [0, 5].map((t) => ({ tS: t, durS: 5, frames: 250, errors: 0, arbBits: 9360, dataBits: 0 })) }
					],
					payloadDist: [
						{ channel: 1, counts: [0, 0, 0, 0, 0, 0, 0, 0, 1000, 500, 0, 0, 0, 0, 0] },
						{ channel: 2, counts: [0, 0, 0, 0, 0, 0, 0, 0, 500, 0, 0, 0, 0, 0, 0] }
					]
				}),
				settings_write: () => null,
				write_file: () => null,
				read_file_raw: () => {
					// The raw channel's frame: 8-byte little-endian header length, the JSON
					// metadata, then the text itself (editor.ts readFileRaw).
					const text = new TextEncoder().encode(window.__harness.oldText);
					const meta = new TextEncoder().encode(JSON.stringify({ binary: false, size: text.length, encoding: 'utf8', eol: 'lf' }));
					const out = new Uint8Array(8 + meta.length + text.length);
					new DataView(out.buffer).setBigUint64(0, BigInt(meta.length), true);
					out.set(meta, 8);
					out.set(text, 8 + meta.length);
					return out;
				},
				read_file_base64: () => btoa(window.__harness.oldText)
			};
			const baseInvoke = window.__TAURI_INTERNALS__.invoke.bind(window.__TAURI_INTERNALS__);
			window.__TAURI_INTERNALS__.invoke = (command, args) =>
				Object.prototype.hasOwnProperty.call(scrollHandlers, command)
					? Promise.resolve(scrollHandlers[command](args || {}))
					: baseInvoke(command, args);

			/* ---------- real-layout measurement over each surface's own DOM ---------- */

			// The row the scroller's top edge cuts through: the row the model's floor(top)
			// says is at the viewport's head. Exact on surfaces whose rows carry no padding.
			const cutRow = (scroller, item, read) => {
				const boundary = rect(scroller).top + 1;
				let found = null;
				for (const node of scroller.querySelectorAll(item)) {
					const box = rect(node);
					if (box.top <= boundary && box.bottom > boundary) found = node;
				}
				return found === null ? null : read(found);
			};
			const parseN = (node) => Number(/line (\d+)/.exec(node.textContent)?.[1] ?? -1);
			const docEditScroller = () => document.querySelector('.doc-edit .cm-scroller');
			// CodeMirror pads its content, so the windowed editor's top is computed rather
			// than cut: the first loaded line's offset from the scroller's top, the content's
			// padding and the measured line height give the model's floating top exactly.
			const docEditTopRow = () => {
				const scroller = docEditScroller();
				const lines = scroller?.querySelectorAll('.cm-line');
				if (!lines || lines.length < 2) return NaN;
				// CodeMirror keeps the caret's line rendered wherever the caret is — a stray
				// block pinned at the content's top when a far drag lands the caret above the
				// slice. The line height comes from the first pair of *adjacent* labels, never
				// from the first two nodes in the DOM (the stray and the slice's head are a
				// window apart).
				let lineHeight = 0;
				for (let i = 0; i < lines.length - 1; i++) {
					if (parseN(lines[i + 1]) === parseN(lines[i]) + 1) {
						lineHeight = rect(lines[i + 1]).top - rect(lines[i]).top;
						break;
					}
				}
				if (!(lineHeight > 0)) return NaN;
				const pad = parseFloat(getComputedStyle(lines[0].parentElement).paddingTop) || 0;
				return (parseN(lines[0]) - 1) + (pad - (rect(lines[0]).top - rect(scroller).top)) / lineHeight;
			};
			const docEditTop = () => {
				const row = docEditTopRow();
				return Number.isFinite(row) ? row + 1 : -1;
			};
			// The projection snaps the scroller to whole pixels, so a measured position lands
			// a rounding error from the model's word; compare within a quarter of a row.
			const near = (expected) => (actual) => Math.abs(actual - expected) <= 0.25;
			const docEditCaret = () => {
				const line = document.querySelector('.doc-edit .cm-activeLine');
				return line ? parseN(line) : -1;
			};
			const codeScroller = () => Array.from(document.querySelectorAll('.cm-scroller')).find((s) => !s.closest('.doc-edit'));
			const dragThumbTo = (container, fraction) => {
				const bar = container.querySelector('.scrollbar.vertical');
				const thumb = bar.querySelector('.scrollbar-thumb');
				const track = rect(bar);
				const grab = rect(thumb).top + 2;
				const at = (type, clientY) => bar.dispatchEvent(new PointerEvent(type, { clientY, button: 0, bubbles: true, pointerId: 1 }));
				thumb.dispatchEvent(new PointerEvent('pointerdown', { clientY: grab, button: 0, bubbles: true, pointerId: 1 }));
				const target = fraction >= 1 ? track.bottom + 10_000 : track.top + track.height * fraction;
				at('pointermove', target);
				at('pointerup', target);
			};
			const openFromTree = async (name) => {
				const row = Array.from(document.querySelectorAll('.tree .row')).find((r) => r.textContent.includes(name));
				if (!row) throw new Error('no tree row for ' + name);
				click(row);
				await sleep(1200);
			};
			const activateTab = (name) => {
				const tab = Array.from(document.querySelectorAll('.tab')).find((t) => t.textContent.includes(name));
				if (tab) click(tab);
			};
			// One surface's failure must not take the rest down: each block records what it
			// got and the harness moves on.
			const surface = async (name, body) => {
				try {
					await body();
				} catch (error) {
					report.push({ surface: name, check: 'the block threw', expected: 'a completed run', actual: String(error && error.message ? error.message : error), status: 'fail' });
				}
			};

			await sleep(1500); // the workbench boots
			await waitFor(() => document.querySelectorAll('.tree .row').length >= 5);
			// Ground-truth probes for a stuck surface: what the scrollbar last measured,
			// what viewport heights the models were told, and whether this page is even
			// visible (a hidden page freezes rAF and with it CM's measure).
			window.__scrollProbe = { visibility: document.visibilityState, layouts: [], viewports: [] };
			const { Scrollbar } = await import('/src/scroll/scrollbar.ts');
			const { ScrollModel } = await import('/src/scroll/model.ts');
			const origLayout = Scrollbar.prototype.layout;
			Scrollbar.prototype.layout = function () {
				const geometry = this.geometry();
				window.__scrollProbe.layouts.push({ track: this.trackLength, idle: this.root.classList.contains('idle'), thumb: geometry ? Math.round(geometry.thumb) : null });
				if (window.__scrollProbe.layouts.length > 40) window.__scrollProbe.layouts.shift();
				return origLayout.call(this);
			};
			const origSetViewport = ScrollModel.prototype.setViewport;
			ScrollModel.prototype.setViewport = function (height) {
				window.__scrollProbe.viewports.push(height);
				if (window.__scrollProbe.viewports.length > 40) window.__scrollProbe.viewports.shift();
				return origSetViewport.call(this, height);
			};
			// Zed's own defaults for the amounts the model defines - the shipped app defaults
			// too (settings.ts), which the end of the run re-checks.
			const { updateSetting, DEFAULT_SETTINGS } = await import('/src/settings.ts');
			updateSetting('mouseWheelScrollSensitivity', 1);
			updateSetting('fastScrollSensitivity', 4);

			/* ----- the code editor (a small file: Zed's wheel over CodeMirror's native scroll) ----- */
			await surface('code editor', async () => {
				await openFromTree('file.txt');
				await waitFor(() => codeScroller());
				const scroller = codeScroller();
				const lineHeight = rect(scroller.querySelector('.cm-line')).height;
				const viewport = rect(scroller).height;
				wheel(scroller, 100);
				const atOnce = scroller.scrollTop;
				await sleep(300);
				const final = scroller.scrollTop;
				check('code editor', 'a wheel notch is three lines at once (Zed, sensitivity 1) - no glide', (px) => Math.abs(px - 3 * lineHeight) <= 1, atOnce);
				check('code editor', 'and nothing eases afterwards', (px) => Math.abs(px - atOnce) <= 1, final);
				wheel(scroller, 100, { altKey: true });
				check('code editor', 'Alt is the fast sensitivity: twelve more lines', (px) => Math.abs(px - 15 * lineHeight) <= 1, scroller.scrollTop);
				key(document.querySelector('.cm-content'), 'PageDown');
				await sleep(300);
				const caret = Number(/line (\d+)/.exec(document.querySelector('.cm-activeLine').textContent)?.[1] ?? -1);
				check('code editor', 'PageDown moves the caret about one viewport (CodeMirror native)', (n) => n >= Math.floor(viewport / lineHeight) - 3 && n <= Math.floor(viewport / lineHeight) + 1, caret - 1);
			});

			/* ----- the windowed large-file editor (the row model under CodeMirror) ----- */
			await surface('windowed editor', async () => {
				await openFromTree('huge.txt');
				await waitFor(() => document.querySelector('.doc-edit'));
				await waitFor(() => docEditTop() === 1);
				// An independent observer on the same element the view's sizer watches: if
				// this one hears the box and the model never did, the view's own wiring is
				// the suspect, not the layout.
				const heard = [];
				const probeRO = new ResizeObserver((entries) => heard.push(Math.round(entries[0].contentRect.height)));
				probeRO.observe(document.querySelector('.doc-edit-viewport'));
				await sleep(400);
				probeRO.disconnect();
				report.push({ surface: 'windowed editor', check: 'an independent RO on .doc-edit-viewport', expected: 'a real height delivered', actual: JSON.stringify(heard), status: 'info' });
				report.push({ surface: 'windowed editor', check: 'DOM chain heights at open', expected: 'every layer sized', actual: JSON.stringify((() => {
					const out = {};
					for (const s of ['.doc-edit', '.doc-edit-viewport', '.doc-edit-host', '.doc-edit-host .cm-editor', '.doc-edit-host .cm-scroller']) {
						const e = document.querySelector(s);
						out[s.replace(/.*\./, '')] = e ? Math.round(e.getBoundingClientRect().height) : null;
					}
					out.viewportsHeard = window.__scrollProbe.viewports;
					return out;
				})()), status: 'info' });
				let hugeRows;
				const lines = document.querySelectorAll('.doc-edit .cm-line');
				const lineHeight = rect(lines[1]).top - rect(lines[0]).top;
				const viewport = rect(docEditScroller()).height;
				const visible = viewport / lineHeight;
				hugeRows = Math.max(1, Math.floor(visible) - 1);
				wheel(docEditScroller(), 100);
				await settle();
				check('windowed editor', 'a wheel notch is the system\'s three lines (sensitivity 1)', near(4), docEditTop());
				wheel(docEditScroller(), 100, { altKey: true });
				await settle();
				check('windowed editor', 'Alt multiplies by the fast sensitivity (4): twelve more', near(16), docEditTop());
				wheel(docEditScroller(), -100);
				await settle();
				check('windowed editor', 'a notch up is three lines back', near(13), docEditTop());
				// Back to the head for the page keys.
				dragThumbTo(document.querySelector(".doc-edit"), 0);
				await sleep(600);
				if (docEditCaret() === 1 && docEditTop() > 2) {
					const probe = probeKey(document.querySelector('.doc-edit .cm-content'), 'PageDown');
					report.push({ surface: 'windowed editor', check: 'PageDown probe (the caret had not moved)', expected: 'seen at the element, not prevented', actual: JSON.stringify(probe), status: 'info' });
				}
				key(document.querySelector('.doc-edit .cm-content'), 'PageDown');
				await sleep(800);
				check('windowed editor', 'PageDown walks the caret a viewport less one row', (n) => Math.abs(n - (1 + hugeRows)) <= 1, docEditCaret());
				check('windowed editor', 'the view follows, the caret three rows off the bottom (fit)', near(1 + hugeRows + 4 - visible), docEditTop());
				for (let i = 0; i < 3; i++) key(document.querySelector('.doc-edit .cm-content'), 'PageDown');
				await sleep(1500);
				check('windowed editor', 'a burst of three more presses is exactly three pages of caret', (n) => Math.abs(n - (1 + 4 * hugeRows)) <= 2, docEditCaret());
				key(document.querySelector('.doc-edit .cm-content'), 'PageUp');
				await sleep(800);
				check('windowed editor', 'PageUp walks one page back', (n) => Math.abs(n - (1 + 3 * hugeRows)) <= 1, docEditCaret());
				// Drag the drawn scrollbar to the file's very end: the last window slides in
				// and the last line stands at the viewport's top (one_page).
				dragThumbTo(document.querySelector(".doc-edit"), 1);
				await sleep(1200);
				check('windowed editor', 'a drag to the bottom lands the last line at the viewport\'s top', near(HUGE_LINES), docEditTop());
			});

			/* ----- the indexed Fast Viewer (the read-only large-file page) ----- */
			await surface('Fast Viewer', async () => {
				await openFromTree('monster.js');
				await waitFor(() => document.querySelector('.fast-view .fast-scroll'));
				await waitFor(() => cutRow(document.querySelector('.fast-scroll'), '.fast-row[data-line]', (n) => Number(n.dataset.line)) === 0);
				let fastPage;
				const scroller = document.querySelector('.fast-scroll');
				const row = scroller.querySelector('.fast-row');
				const lineHeight = rect(row).height;
				fastPage = Math.trunc(rect(scroller).height / lineHeight - 1);
				const top = () => cutRow(scroller, '.fast-row[data-line]', (n) => Number(n.dataset.line));
				wheel(scroller, 100);
				await settle();
				check('Fast Viewer', 'a wheel notch is three rows', 3, top());
				wheel(scroller, 100, { altKey: true });
				await settle();
				check('Fast Viewer', 'Alt is four notches more', 15, top());
				const probe = probeKey(scroller, 'PageDown');
				await sleep(200);
				if (top() === 15) report.push({ surface: 'Fast Viewer', check: 'PageDown probe (the view had not moved)', expected: 'seen at the element, not prevented', actual: JSON.stringify(probe), status: 'info' });
				key(scroller, 'PageDown');
				await sleep(300);
				check('Fast Viewer', 'two PageDowns are exactly two pages (viewport less one row)', 15 + 2 * fastPage, top());
				key(scroller, 'PageUp');
				await sleep(300);
				check('Fast Viewer', 'PageUp is one page back', 15 + fastPage, top());
				// Ctrl+PageDown is the workbench's Next Editor here: prevented, and the tab
				// moves - so this press comes last in the block.
				const event = new KeyboardEvent('keydown', { key: 'PageDown', ctrlKey: true, bubbles: true, cancelable: true });
				scroller.dispatchEvent(event);
				check('Fast Viewer', 'Ctrl+PageDown goes to the workbench\'s Next Editor (prevented)', true, event.defaultPrevented);
			});

			/* ----- the hex view (a binary page, with a caret) ----- */
			await surface('hex view', async () => {
				await openFromTree('blob.bin');
				await waitFor(() => document.querySelector('.hex-scroller'));
				await waitFor(() => document.querySelector('.hex-scroller [data-row="0"]'));
				const scroller = document.querySelector('.hex-scroller');
				const top = () => cutRow(scroller, '.hex-row[data-row]', (n) => Number(n.dataset.row));
				const lineHeight = rect(scroller.querySelector('.hex-row[data-row]')).height;
				const visible = rect(scroller).height / lineHeight;
				wheel(scroller, 100);
				await settle();
				check('hex view', 'a wheel notch is three rows on a binary too', 3, top());
				key(scroller, 'PageDown');
				await sleep(400);
				check('hex view', 'PageDown pages the caret and the view follows with margin', (t) => Math.abs(t - Math.floor(Math.floor(visible) + 3 - visible)) <= 1, top());
				key(scroller, 'PageUp');
				await sleep(400);
				check('hex view', 'PageUp returns to the head', 0, top());
			});

			/* ----- the hex compare (two panes over one model), constructed directly ----- */
			await surface('hex compare', async () => {
				const { HexCompareView } = await import('/src/hexCompare.ts');
				const view = new HexCompareView('C:\\l.bin', 'C:\\r.bin');
				document.getElementById('editorGroup').appendChild(view.root);
				await view.load();
				const scroller = view.root.querySelector('.hex-scroller');
				await waitFor(() => view.scroll.visibleLines > 0);
				const page = Math.trunc(view.scroll.visibleLines - 1);
				wheel(scroller, 100);
				check('hex compare', 'a wheel notch is three rows, both panes', 3, view.scroll.top);
				wheel(scroller, 100, { altKey: true });
				check('hex compare', 'Alt is four notches more', 15, view.scroll.top);
				key(scroller, 'PageDown');
				key(scroller, 'PageDown');
				check('hex compare', 'two PageDowns are two pages', 15 + 2 * page, view.scroll.top);
				key(scroller, 'PageUp');
				check('hex compare', 'PageUp is one page back', 15 + page, view.scroll.top);
				view.destroy();
				view.root.remove();
			});

			/* ----- the CAN raw view (.asc), constructed directly ----- */
			await surface('CAN raw view', async () => {
				const { CanRawView } = await import('/src/canRawView.ts');
				const view = new CanRawView('/repo/trace.asc');
				document.getElementById('editorGroup').appendChild(view.root);
				await waitFor(() => view.scroll.rowCount === CAN_FRAMES && view.scroll.visibleLines > 0);
				const scroller = view.root.querySelector('.can-raw-scroll');
				const page = Math.trunc(view.scroll.visibleLines - 1);
				wheel(scroller, 100);
				check('CAN raw view', 'a wheel notch is three rows of frames', 3, view.scroll.top);
				wheel(scroller, 100, { altKey: true });
				check('CAN raw view', 'Alt is four notches more', 15, view.scroll.top);
				key(scroller, 'PageDown');
				key(scroller, 'PageDown');
				check('CAN raw view', 'two PageDowns are two pages', 15 + 2 * page, view.scroll.top);
				key(scroller, 'PageUp');
				check('CAN raw view', 'PageUp is one page back', 15 + page, view.scroll.top);
				view.dispose();
				view.root.remove();
			});

			/* ----- the CAN statistics dashboard: a full pane scrolls, no chart is clipped ----- */
			await surface('CAN statistics', async () => {
				const { CanLogView } = await import('/src/canLogView.ts');
				const view = new CanLogView('/repo/trace.asc');
				document.getElementById('editorGroup').appendChild(view.root);
				await waitFor(() => view.root.querySelectorAll('.can-chart').length >= 3);
				// A short window over the full dashboard: the right pane cannot fit its
				// stacked sections, so the pane must scroll while every section keeps its
				// content height - before the flex fix the sections were squeezed instead and
				// `overflow: hidden` clipped the load chart's bottom.
				view.root.style.flex = 'none';
				view.root.style.height = '420px';
				await settle();
				const pane = view.root.querySelector('.can-pane-right');
				const clipped = Array.from(pane.querySelectorAll(':scope > .can-section')).filter((s) => s.scrollHeight > s.clientHeight + 1);
				check('CAN statistics', 'the overflowing pane itself scrolls', true, pane.scrollHeight > pane.clientHeight);
				check('CAN statistics', 'no chart section clips its content', 0, clipped.length);
				// And the load chart really is the pane's scrollable content, not a blank.
				check('CAN statistics', 'the load chart drew its lines', 2, pane.querySelectorAll('.can-section-load path.can-chart-line').length);
				view.root.remove();
			});

			/* ----- the shipped defaults are Zed's: the same notches at the app's own settings ----- */
			await surface('shipped defaults', async () => {
				activateTab('huge.txt');
				await sleep(600);
				dragThumbTo(document.querySelector(".doc-edit"), 0);
				await sleep(600);
				check('shipped defaults', 'the shipped wheel sensitivity is Zed\'s 1', 1, DEFAULT_SETTINGS.mouseWheelScrollSensitivity);
				check('shipped defaults', 'the shipped fast sensitivity is Zed\'s 4', 4, DEFAULT_SETTINGS.fastScrollSensitivity);
				updateSetting('mouseWheelScrollSensitivity', DEFAULT_SETTINGS.mouseWheelScrollSensitivity);
				updateSetting('fastScrollSensitivity', DEFAULT_SETTINGS.fastScrollSensitivity);
				wheel(docEditScroller(), 100);
				check('shipped defaults', 'a notch at the shipped sensitivity is three lines', near(4), docEditTop());
				wheel(docEditScroller(), 100, { altKey: true });
				check('shipped defaults', 'Alt at the shipped fast sensitivity is twelve more', near(16), docEditTop());
			});

			for (const error of window.__pageErrors || []) {
				report.push({ surface: 'page', check: 'page error', expected: 'none', actual: error, status: 'fail' });
			}
			const toast = document.querySelector('#notifications');
			if (toast && toast.textContent) report.push({ surface: 'page', check: 'notification shown', expected: 'none', actual: toast.textContent, status: 'info' });
			report.push({ surface: 'page', check: 'probe: visibility / model viewports / scrollbar tracks', expected: 'visible, real heights', actual: JSON.stringify(window.__scrollProbe), status: 'info' });
			window.__scrollReport = report;
			const failed = report.filter((r) => r.status === 'fail').length;
			console.table(report);
			console.log('[scroll-harness] ' + (report.length - failed) + ' pass, ' + failed + ' fail');
			const panel = document.createElement('div');
			panel.id = 'scroll-report';
			panel.style.cssText = 'position:fixed;left:8px;bottom:34px;z-index:9998;max-width:640px;max-height:60vh;overflow:auto;' +
				'font:11px monospace;color:#eee;background:rgba(20,20,20,0.95);border:1px solid #555;padding:8px;';
			panel.innerHTML = '<b>SCROLL HARNESS - ' + (failed === 0 ? 'ALL PASS' : failed + ' FAILING') + '</b>' +
				'<table style="border-collapse:collapse;margin-top:4px">' +
				report.map((r) => '<tr><td style="padding:1px 8px;color:' + (r.status === 'fail' ? '#f48771' : '#73c991') + '">' + r.status.toUpperCase() +
					'</td><td style="padding:1px 8px">' + r.surface + '</td><td style="padding:1px 8px">' + r.check +
					'</td><td style="padding:1px 8px;color:#aaa">' + r.expected + ' / got ' + r.actual + '</td></tr>').join('') +
				'</table>';
			document.body.appendChild(panel);
		}
		</script>
		<script type="module">
			// The full mode (?full=1): the harness's complete functional pass — every module's
			// own self-test checks (the "all buttons" sweep the Help menu's Run Module
			// Self-Tests page runs, executed here against the live workbench), then the two
			// marketplace extensions end to end: git-graph-rs (install state, backend,
			// every declared command, every contributed menu placement, the view rendering
			// commits, the safe command set run with observable results) and claude-code
			// (install state, backend, its command surface, the chat webview mounting, the
			// activity-bar entry, a clean extension-host log). The extension phases need the
				// real backend — under the scripted mock they skip (the banner says why); open
				// this page under `tauri dev` (Help -> Open Dev Harness) for the full pass.
				// The sandbox mode (?sandbox=1, run by scripts/probes/claude-code-sandbox.mjs)
				// adds a measured claude-code conversation against the local fake Claude
				// server and posts the finished report out over ?report=<url>.
				// Commands that would mutate the open repository (amend, reset-to-remote, the
				// Gerrit writes) are structurally checked only — their execution belongs to the
				// temp-repo live checks (scripts/probes/git-graph-menus-live-check.mjs).
			// The page-boot beacon: written the instant the harness page loads with a reportFile,
			// before anything else — a probe can then tell "the window never opened the harness
			// page" (no beacon file) from "the page loaded but the pass broke" (beacon, no rows).
			{
				const beaconFile = new URLSearchParams(location.search).get('reportFile');
				if (beaconFile) {
					import('@tauri-apps/api/core').then((core) => core.invoke('write_file', { path: beaconFile,
						contents: JSON.stringify({ probe: 'dev-harness', partial: true, beacon: 'page-boot', postedAt: new Date().toISOString(), report: [] }) })).catch(() => {});
				}
			}
			if (new URLSearchParams(location.search).has('full')) {
				// A clean boot per distinct query string, the scroll mode's rule.
				if (sessionStorage.getItem('full-clean') !== location.search) {
					sessionStorage.setItem('full-clean', location.search);
					// Clear the session junk but keep the extensions' mementos (extMemento.*):
					// wiping them made every run forget the login state the previous run ended
					// with — the claude wizard then greeted each run after a logout test.
					const kept = {};
					for (let i = 0; i < localStorage.length; i++) {
						const key = localStorage.key(i);
						if (key && key.startsWith('extMemento.')) kept[key] = localStorage.getItem(key);
					}
					localStorage.clear();
					for (const [key, value] of Object.entries(kept)) localStorage.setItem(key, value);
					location.reload();
				}
				const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
				const waitFor = async (ready, ms = 20000, onTick) => {
					const end = Date.now() + ms;
					let ticks = 0;
					while (Date.now() < end) {
						if (ready()) return true;
						ticks++;
						if (onTick && ticks % 600 === 0) onTick(); // roughly every minute at 100 ms ticks
						await sleep(100);
					}
					return ready();
				};
				const withTimeout = (promise, ms, label) => Promise.race([
					promise,
					sleep(ms).then(() => { throw new Error(label + ' timed out after ' + ms + ' ms'); })
				]);
				const escapeOverlays = () => {
					for (const target of [document.querySelector('.quick-input'), document.activeElement, document.body]) {
						if (!target) continue;
						target.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
					}
				};
				const report = [];
				let panel = null;
				const renderPanel = () => {
					if (!panel) {
						panel = document.createElement('div');
						panel.id = 'full-report';
						panel.style.cssText = 'position:fixed;left:8px;bottom:34px;z-index:9998;max-width:760px;max-height:65vh;overflow:auto;' +
							'font:11px monospace;color:#eee;background:rgba(20,20,20,0.96);border:1px solid #555;padding:8px;';
						document.body.appendChild(panel);
					}
					const failed = report.filter((r) => r.status === 'fail').length;
					panel.innerHTML = '<b>FULL HARNESS (' + (window.__harness.mocked ? 'MOCKED — extension phases skip' : 'REAL BACKEND') + ') - ' +
						(failed === 0 ? 'ALL PASS' : failed + ' FAILING') + '</b>' +

							return 'pid ' + own.pid + (own.lastError ? ' (last error: ' + own.lastError + ')' : '');
						});
						const CLAUDE_COMMANDS = ['claude-vscode.window.open', 'claude-vscode.sidebar.open', 'claude-vscode.newConversation',
							'claude-vscode.reopenClosedSession', 'claude-vscode.focus', 'claude-vscode.focusLastMessage', 'claude-vscode.blur',
							'claude-vscode.editor.openLast', 'claude-vscode.update', 'claude-vscode.logout',
							'claude-vscode.terminal.open', 'claude-vscode.insertAtMention'];
					for (const id of CLAUDE_COMMANDS) {
						await check(CLAUDE, 'command registered: ' + id, async () => {
							const command = commands.get(id);
							if (!command) throw new Error('absent from the palette registry');
							return command.title;
						});
					}
					// Coverage: a command the extension declares must sit in the list above (or,
					// in the sandbox, in its per-button table) — otherwise this pass never tests it.
					await check(CLAUDE, 'coverage: every registry command is in the declared list', async () => {
						const declared = commands.all().map((c) => c.id).filter((id) => id.startsWith('claude-vscode.')).sort();
						const missing = declared.filter((id) => !CLAUDE_COMMANDS.includes(id));
						if (missing.length && !sandboxMode) throw new Error('untested buttons: ' + missing.join(', '));
						return declared.length + ' commands declared';
					});
					await check(CLAUDE, 'the activity bar carries the sessions entry', async () => {
							// The entry lands when the activation's setContext names the sessions
							// list — right after the backend handshake, not instantly.
							const findEntry = () => [...document.querySelectorAll('#activitybar [title], #activitybar [aria-label]')]
								.some((el) => ((el.getAttribute('title') || '') + (el.getAttribute('aria-label') || '')).toLowerCase().includes('claude'));
							const found = await waitFor(findEntry, 30000);
							if (!found) throw new Error('no Claude entry in the activity bar');
							return 'present';
						});
						await check(CLAUDE, 'the chat webview opens and mounts', async () => {
							await withTimeout(commands.execute('claude-vscode.window.open'), 10000, 'claude-vscode.window.open').catch(async () => {
								await withTimeout(commands.execute('claude-vscode.sidebar.open'), 10000, 'claude-vscode.sidebar.open');
							});
							let opened = false;
							const mounted = await waitFor(() => {
								const frames = document.querySelectorAll('#editorPart iframe.ext-page-frame, #sidebar iframe.ext-page-frame');
								return [...frames].some((frame) => {
									if (!frame.contentDocument) return false;
									const doc = frame.contentDocument;
									return doc.body && doc.body.childElementCount > 0 && (doc.body.textContent || '').length > 50;
								});
							}, 120000, () => {
								// Halfway: the cold 5.4 MB bundle has outlasted a minute on a loaded
								// machine — nudge it with a second open.
								if (!opened) { opened = true; commands.execute('claude-vscode.window.open').catch(() => undefined); }
							});
							if (!mounted) throw new Error('the chat webview never mounted its UI (the multi-MB bundle gets 120 s)');
							return 'chat UI mounted';
						});
						await check(CLAUDE, 'a new session opens a populated page — the blank-session regression', async () => {
							const framesBefore = document.querySelectorAll('#editorPart iframe.ext-page-frame, #sidebar iframe.ext-page-frame').length;
							// The user's path: the "New session" button inside the mounted chat opens a new
							// tab-hosted panel — the exact surface the mount race blanked (the extension's
							// initial postMessage crossed before the tab mounted and vanished).
							const clicked = [...document.querySelectorAll('#editorPart iframe.ext-page-frame, #sidebar iframe.ext-page-frame')].some((node) => {
								const button = node.contentDocument?.querySelector('[aria-label="New session"]');
								if (button) { button.click(); return true; }
								return false;
							});
							if (!clicked) throw new Error('no "New session" button in the mounted chat');
							const fresh = await waitFor(() => {
								const frames = [...document.querySelectorAll('#editorPart iframe.ext-page-frame, #sidebar iframe.ext-page-frame')];
								const wizard = frames.some((frame) => {
									try { return /How do you want to log in\?/i.test(frame.contentDocument.body ? frame.contentDocument.body.textContent : ''); } catch { return false; }
								});
								if (wizard) return 'wizard';
								if (frames.length <= framesBefore) return false;
								return frames.slice(framesBefore).every((frame) => {
									const doc = frame.contentDocument;
									if (!doc || !doc.body) return false;
									return doc.body.childElementCount > 0 && (doc.body.textContent || '').length > 50;
								}) ? 'rendered' : false;
							}, 150000);
							if (fresh === 'wizard') {
								const skip = new Error('the login-choice wizard owns the chat surface (a previous run\'s logout test left it up) — the blank-session path is proven by the wizard-free runs');
								skip.harnessSkip = true;
								throw skip;
							}
							if (!fresh) throw new Error('the new session page stayed empty — its initial state was lost in the mount race');
							return 'new session page rendered';
						});
						// The conversation itself: interactive (a real account) unless the sandbox
						// runs it — the fake login + the local fake Claude server make it a
						// measured, hermetic round trip: type into the mounted chat, send, and
						// time send → the fake reply's first token and its settled render.
						if (!sandboxMode) {
							skip(CLAUDE, 'a real conversation', 'needs a signed-in account — stays interactive (scripts/probes/claude-code-sandbox.mjs runs one against the local fake server)');
						} else {
							await check(CLAUDE, 'a conversation round-trips the fake Claude server', async () => {
								let frames = chatFrames();
								if (!frames.length) throw new Error('no mounted chat frame');
								const wizardUp = () => /How do you want to log in\?/i.test(frames.map((f) => (f.contentDocument.body ? f.contentDocument.body.textContent : '')).join(' '));
								// claude's first-run onboarding (the subscription/billing welcome) can sit
								// over the composer — a previous run's logout poisons it into view. Click
								// the wizard's primary button through its rounds first.
								for (let round = 0; round < 3; round++) {
									const text = frames.map((f) => (f.contentDocument.body.textContent || '')).join(' ');
									if (!/subscription|billed|get started|sign in|log in/i.test(text)) break;
									let clicked = false;
									for (const frame of frames) {
										const primary = [...frame.contentDocument.querySelectorAll('button')]
											.filter((b) => /continue|skip|not now|later|got it/i.test(b.textContent || '')).pop();
										if (primary) { primary.click(); clicked = true; }
									}
									if (!clicked) break;
									await sleep(2500);
									frames = chatFrames();
								}
								if (wizardUp()) {
									const skip = new Error('the login-choice wizard owns the chat surface (a previous run\'s logout test left it up) — the conversation path is proven by the wizard-free runs; the wizard itself is claude\'s auth UX, not this harness\'s surface');
									skip.harnessSkip = true;
									throw skip;
								}
								let doc = null;
								let composer = null;
								const findComposer = () => {
									for (const frame of chatFrames()) {
										const found = chatComposer(frame.contentDocument);
										if (found) return { frame, found };
									}
									return null;
								};
								const first = findComposer();
								if (first) { doc = first.frame.contentDocument; composer = first.found; }
								if (!composer) {
									// The wizard owns the mounted frame — the New-session page mounts a
									// real chat beside it; click through to that and poll for its
									// composer (the frames land late on a cold run).
									const before = chatFrames().length;
									const newSession = chatFrames().map((f) => f.contentDocument.querySelector('[aria-label="New session"]')).find(Boolean);
									if (newSession) newSession.click();
									const landed = await waitFor(() => {
										const hit = findComposer();
										if (hit) { doc = hit.frame.contentDocument; composer = hit.found; return true; }
										return false;
									}, 120000);
									if (!landed) composer = null;
								}
								if (!composer) {
									const labels = [...doc.querySelectorAll('button[aria-label]')].map((b) => b.getAttribute('aria-label')).slice(0, 12).join(', ');
									const bodyText = frames.map((f) => (f.contentDocument.body ? f.contentDocument.body.textContent : '')).join(' ');
									if (wizardUp()) {
										const skip = new Error('the login-choice wizard owns the chat surface (a previous run\'s logout test left it up) — the conversation path is proven by the wizard-free runs; the wizard itself is claude\'s auth UX, not this harness\'s surface');
										skip.harnessSkip = true;
										throw skip;
									}
									throw new Error('no composer (textarea / contenteditable) — body "' + bodyText.replace(/\s+/g, ' ').slice(0, 200) + '" buttons: ' + labels);
								}
								composer.focus();
								const prompt = 'harness sandbox ping ' + Date.now();
								doc.execCommand('insertText', false, prompt);
								const t0 = performance.now();
								composer.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true, cancelable: true }));
								// Some builds gate synthetic Enter (isTrusted) — the Send button is the
								// fallback, but ONLY when the composer still holds the prompt: a
								// slow first token must not trigger a second, duplicate send.
								await sleep(1200);
								const bodyText = () => (doc.body.textContent || '');
								const composerText = String(composer.value ?? composer.textContent ?? '');
								if (!bodyText().includes('FAKE-CLAUDE') && composerText.includes(prompt)) {
									const send = [...doc.querySelectorAll('button[aria-label]')].find((b) => /send/i.test(b.getAttribute('aria-label') || ''));
									if (send) send.click();
								}
								let firstToken = 0;
								const arrived = await waitFor(() => {
									// The wizard can render late (after the send found the composer) —
									// the moment it owns the surface, the row's honest answer is skip.
									if (wizardUp()) return 'wizard';
									if (bodyText().includes('FAKE-CLAUDE')) { if (!firstToken) firstToken = Math.round(performance.now() - t0); return 'reply'; }
									return false;
								}, 90000);
								if (arrived === 'wizard') {
									const skip = new Error('the login-choice wizard took over the chat surface mid-conversation (a previous run\'s logout test left it up) — the conversation path is proven by the wizard-free runs');
									skip.harnessSkip = true;
									throw skip;
								}
								if (!arrived) throw new Error('no FAKE-CLAUDE reply within 90 s — body "' + bodyText().replace(/\s+/g, ' ').slice(0, 240) + '"');
								// Let the streamed reply settle (its length stops growing), then read the settled time.
								let settled = 0;
								let lastLen = -1;
								for (let i = 0; i < 100; i++) {
									await sleep(300);
									const len = bodyText().length;
									if (len === lastLen) { settled = Math.round(performance.now() - t0); break; }
									lastLen = len;
								}
								return `send → first token ${firstToken} ms, settled ${settled || firstToken} ms (streamed by the local fake server)`;
							});
						}
						// The per-button pass (sandbox only): every claude-vscode command the registry
						// carries, one row each. The account-destructive ones are exactly why this is
						// sandbox-gated — logout tears down the FAKE login, update's version check
						// would phone the real CDN; here both are hermetic. window.open and the
						// new-session flow are already exercised above and just get classified.
						if (sandboxMode) {
							const runsOnChat = (id, label) => async () => {
								if (!chatFrames().length) throw new Error('no mounted chat frame (the open check above failed?)');
								await withTimeout(commands.execute(id), 10000, id);
								await sleep(300);
								return label;
							};
							const CLAUDE_SANDBOX_BEHAVIORS = {
								'claude-vscode.window.open': async () => 'covered by "the chat webview opens and mounts" above',
								'claude-vscode.newConversation': async () => 'covered by "a new session opens a populated page" above',
								'claude-vscode.focus': runsOnChat('claude-vscode.focus', 'focused the chat tab'),
								'claude-vscode.focusLastMessage': runsOnChat('claude-vscode.focusLastMessage', 'scrolled to the last message'),
								'claude-vscode.insertAtMention': runsOnChat('claude-vscode.insertAtMention', 'inserted the @-mention into the composer'),
								'claude-vscode.editor.openLast': runsOnChat('claude-vscode.editor.openLast', 'opened the last tool output / code block'),
								'claude-vscode.reopenClosedSession': runsOnChat('claude-vscode.reopenClosedSession', 'reopened the last session'),
								'claude-vscode.terminal.open': runsOnChat('claude-vscode.terminal.open', 'opened the claude terminal'),
								'claude-vscode.blur': runsOnChat('claude-vscode.blur', 'blurred the chat'),
								'claude-vscode.sidebar.open': runsOnChat('claude-vscode.sidebar.open', 'opened the sessions sidebar'),
								'claude-vscode.update': async () => {
									await withTimeout(commands.execute('claude-vscode.update'), 20000, 'update').catch(() => undefined);
									await sleep(400);
									escapeOverlays();
									return 'ran; the version check resolves against the sandbox\'s blocked network';
								},
								// Last on purpose: it destroys the fake login everything above used —
								// and the memento snapshot below puts that state back for the next run.
								'claude-vscode.logout': async () => {
									await withTimeout(commands.execute('claude-vscode.logout'), 10000, 'logout').catch(() => undefined);
									await sleep(500);
									escapeOverlays();
									try {
										const key = 'extMemento.global.Anthropic.claude-code';
										const snap = window.__claudeMementoSnapshot;
										if (snap === undefined) localStorage.removeItem(key);
										else localStorage.setItem(key, snap);
									} catch { /* a memento hiccup must not fail the row */ }
									return 'logged the FAKE account out (the pre-logout memento was restored for the next run)';
								},
								// The diff-review surface: no proposed diff exists in the sandbox, so
								// these are no-ops — the row proves the buttons execute cleanly.
								'claude-vscode.acceptProposedDiff': runsTolerant('claude-vscode.acceptProposedDiff', 8000, 'ran (no proposed diff in the sandbox)'),
								'claude-vscode.acceptProposedHunk': runsTolerant('claude-vscode.acceptProposedHunk', 8000, 'ran (no proposed hunk in the sandbox)'),
								'claude-vscode.acceptProposedHunkFromBar': runsTolerant('claude-vscode.acceptProposedHunkFromBar', 8000, 'ran (no proposed hunk in the sandbox)'),
								'claude-vscode.rejectProposedDiff': runsTolerant('claude-vscode.rejectProposedDiff', 8000, 'ran (no proposed diff in the sandbox)'),
								'claude-vscode.rejectProposedHunk': runsTolerant('claude-vscode.rejectProposedHunk', 8000, 'ran (no proposed hunk in the sandbox)'),
								'claude-vscode.rejectProposedHunkFromBar': runsTolerant('claude-vscode.rejectProposedHunkFromBar', 8000, 'ran (no proposed hunk in the sandbox)'),
								// Session-tab surface.
								'claude-vscode.addSessionTabToGroup': runsTolerant('claude-vscode.addSessionTabToGroup', 8000, 'ran (no session tab group in the sandbox)'),
								'claude-vscode.renameSessionTab': runsTolerant('claude-vscode.renameSessionTab', 8000, 'ran (the rename input is dismissed with the row)'),
								'claude-vscode.markSessionUnread': runsTolerant('claude-vscode.markSessionUnread', 8000, 'ran'),
								// Surfaces that open things.
								'claude-vscode.editor.open': runsTolerant('claude-vscode.editor.open', 8000, 'opened the claude editor surface'),
								'claude-vscode.primaryEditor.open': runsTolerant('claude-vscode.primaryEditor.open', 8000, 'opened the claude primary editor'),
								'claude-vscode.openWalkthrough': runsTolerant('claude-vscode.openWalkthrough', 8000, 'opened the walkthrough tab'),
								'claude-vscode.showLogs': runsTolerant('claude-vscode.showLogs', 8000, 'revealed the Extension Host log channel'),
								'claude-vscode.terminal.open.keyboard': runsTolerant('claude-vscode.terminal.open.keyboard', 8000, 'opened the claude terminal (keyboard path)'),
								'claude-vscode.toggleDictation': runsTolerant('claude-vscode.toggleDictation', 8000, 'toggled dictation'),
								'claude-vscode.toggleFocusView': runsTolerant('claude-vscode.toggleFocusView', 8000, 'toggled the focus view'),
								// Pickers — dismissing never confirms.
								'claude-vscode.createWorktree': openDismiss('claude-vscode.createWorktree'),
								'claude-vscode.installPlugin': openDismiss('claude-vscode.installPlugin')
							};
							try { window.__claudeMementoSnapshot = localStorage.getItem('extMemento.global.Anthropic.claude-code'); } catch { /* private mode */ }
							const CLAUDE_BUTTON_ORDER = ['claude-vscode.window.open', 'claude-vscode.focus', 'claude-vscode.focusLastMessage',
								'claude-vscode.insertAtMention', 'claude-vscode.newConversation', 'claude-vscode.editor.openLast',
								'claude-vscode.reopenClosedSession', 'claude-vscode.terminal.open', 'claude-vscode.blur',
								'claude-vscode.sidebar.open', 'claude-vscode.update', 'claude-vscode.logout'];
							await runPluginButtons(CLAUDE, 'claude-vscode.', CLAUDE_SANDBOX_BEHAVIORS, CLAUDE_BUTTON_ORDER);
						}
					}
				}

				/* ---------- Phase 3½: git-graph-rs against the sandbox's fake remote ---------- */
				if (!window.__harness.mocked && quick && sandboxMode) await runGgSandboxPass();

				/* ---------- Phase S: speed — the open latencies the user feels ---------- */
				if (window.__harness.mocked) {
					skip('speed', 'everything', 'the scripted mock has no real webviews — run under tauri dev');
				} else {
					const webviewFrame = () => document.querySelector('#editorPart iframe.ext-page-frame');
					const mounted = (minText) => {
						const frame = webviewFrame();
						if (!frame || !frame.contentDocument || !frame.contentDocument.body) return false;
						return frame.contentDocument.body.childElementCount > 0 && (frame.contentDocument.body.textContent || '').length >= minText;
					};
					const ggInstalled = !quick && extList.some((e) => e.id === GG);
					if (ggInstalled) {
						await check('speed', 'git-graph view: command -> graph rendered', async () => {
							const t = performance.now();
							await withTimeout(commands.execute('git-graph-rs.view'), 10000, 'view');
							const ok = await waitFor(() => mounted(100), 20000);
							if (!ok) throw new Error('never rendered');
							return Math.round(performance.now() - t) + ' ms';
						});
					}
					if (extList.some((e) => e.id === CLAUDE)) {
						await check('speed', 'claude chat open: command -> chat mounted', async () => {
							const t = performance.now();
							await withTimeout(commands.execute('claude-vscode.window.open'), 10000, 'open').catch(async () => {
								await withTimeout(commands.execute('claude-vscode.sidebar.open'), 10000, 'sidebar.open');
							});
							const ok = await waitFor(() => mounted(0), 30000);
							if (!ok) throw new Error('never mounted');
							return Math.round(performance.now() - t) + ' ms';
						});
						await check('speed', 'claude chat reopen (warm): close -> command -> mounted', async () => {
							await withTimeout(commands.execute('workbench.closeEditor'), 5000, 'close');
							await sleep(500);
							const t = performance.now();
							await withTimeout(commands.execute('claude-vscode.window.open'), 10000, 'reopen').catch(async () => {
								await withTimeout(commands.execute('claude-vscode.sidebar.open'), 10000, 'sidebar.open');
							});
							const ok = await waitFor(() => mounted(0), 30000);
							if (!ok) throw new Error('never mounted');
							return Math.round(performance.now() - t) + ' ms (warm)';
						});
						// The user's "open another claude page" path: the in-chat New session
						// button → a fresh populated tab-hosted page (not the blank mount race).
						await check('speed', 'claude new session: button click -> populated page', async () => {
							const before = chatFrames().length;
							const button = chatFrames().map((f) => f.contentDocument.querySelector('[aria-label="New session"]')).find(Boolean);
							if (!button) throw new Error('no "New session" button in the mounted chat');
							const t = performance.now();
							button.click();
							const ok = await waitFor(() => {
								const frames = chatFrames();
								if (frames.length <= before) return false;
								return frames.slice(before).every((frame) => (frame.contentDocument.body.textContent || '').length > 50);
							}, 30000);
							if (!ok) throw new Error('the new session page never populated');
							return Math.round(performance.now() - t) + ' ms';
						});
						await check('speed', 'ggs:// transport: fetch claude\'s 5.4 MB index.js', async () => {
							let res;
							const t = performance.now();
							try {
								res = await fetch('ggs://localhost/' + CLAUDE + '/webview/index.js');
							} catch (e) {
								// WKWebView cannot fetch custom schemes from page script (WebView2 can) —
								// the transport itself is proven by the webview frames loading over ggs://.
								const skip = new Error('this platform\'s webview cannot fetch ggs:// from script (' + e + ')');
								skip.harnessSkip = true;
								throw skip;
							}
							const len = (await res.text()).length;
							return len + ' chars in ' + Math.round(performance.now() - t) + ' ms';
						});
					}
				}

				/* ---------- Phase 4: the workbench itself ---------- */
				await check('workbench', 'no page errors during the run', async () => {
					// In the sandbox the logout button's error is by design (there is no OAuth
					// session to end — the fake login is env-key based) and its log line lands
					// here; tolerate exactly that, nothing else.
					const expected = sandboxMode ? /claude-vscode\.(logout|addSessionTabToGroup|renameSessionTab|markSessionUnread|acceptProposed|rejectProposed)/ : null;
					const real = (window.__pageErrors || []).filter((e) => !(expected && expected.test(e)));
					if (real.length > 0) throw new Error(real.slice(0, 3).join(' | '));
					return sandboxMode ? 'clean (the sandbox-expected logout error tolerated)' : 'clean console';
				});
				await check('workbench', 'no new error-level extension host log entries', async () => {
					const errors = extLogEntries().filter((e) => e.level === 'error');
					const newErrors = errors.slice(logErrorsBefore);
					const unexpected = newErrors.filter((e) => !(sandboxMode && /claude-vscode\.(logout|addSessionTabToGroup|renameSessionTab|markSessionUnread|acceptProposed|rejectProposed)/.test(JSON.stringify(e))));
					if (unexpected.length > 0) throw new Error(unexpected.length + ' unexpected error entries: ' + unexpected.slice(0, 2).map((e) => String(e.message || '')).join(' | ').slice(0, 200));
					return sandboxMode && newErrors.length ? 'clean (the sandbox-expected logout error tolerated)' : 'clean';
				});

				window.__fullReport = report;
				const failed = report.filter((r) => r.status === 'fail').length;
				const passed = report.filter((r) => r.status === 'pass').length;
				console.log('[full-harness] ' + passed + ' pass, ' + failed + ' fail, ' + report.filter((r) => r.status === 'skip').length + ' skip');
				window.__fullMarkdown = '# Full harness\n\n' + reportMarkdown(selfOutcomes) + '\n\n## Extension pass\n' +
					report.filter((r) => r.group === GG || r.group === CLAUDE || r.group === 'workbench')
						.map((r) => '- ' + r.status.toUpperCase() + ': ' + r.name + (r.detail ? ' — ' + r.detail : '')).join('\n');
				renderPanel();
				// A fail exits non-zero for the headless driver (run-full-harness.mjs reads the flag).
				window.__fullFailed = failed;
				// The sandbox run's way home: macOS WKWebView has no CDP, so the report crosses
				// as a POST to the probe's fake Claude server (CORS-open on purpose).
				postReport(true);
				if (reportUrl) console.log('[full] the final report was posted to ' + reportUrl);
			}
		</script>
