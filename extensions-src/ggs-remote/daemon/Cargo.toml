[package]
name = "ggs-remote"
version = "0.1.2"
description = "GGS Remote: the tray daemon that serves Git Graph Studio to a phone or another computer over HTTPS + a binary WebSocket (ggs-remote/1)"
edition = "2021"
rust-version = "1.94"
license = "MIT"
publish = false

# Its own workspace: the daemon is a plugin binary, never a member of the app's workspace,
# and the app binary never links it (docs/ggs-remote-plan.md §3.1).
[workspace]

[[bin]]
name = "ggs-remote"
path = "src/main.rs"

[lib]
name = "ggs_remote"
path = "src/lib.rs"

[features]
default = ["tray"]
# The system tray (tray-icon + tao on Windows/macOS, ksni on Linux). Off: the daemon runs
# headless — managed from the GGS extension page or the CLI (the Linux no-tray mode too).
tray = ["dep:tray-icon", "dep:tao", "dep:ksni"]

[dependencies]
tokio = { version = "1.40", features = ["rt", "net", "time", "sync", "macros", "io-util", "fs", "process", "signal"] }
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio", "query", "json"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1.3"
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.3"
subtle = "2.6"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = { version = "0.10", features = ["alloc"] }
hmac = "0.12"
base64 = "0.22"
brotli = "8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
mime_guess = "2"
interprocess = { version = "2.2", features = ["tokio"] }
# The security sandbox's engine (module 19, docs/ggs-remote-plan.md §24): the Microsoft
# eXecution Container — policy-driven OS-native process containment (ProcessContainer on
# Windows, bubblewrap on Linux, Seatbelt on macOS), the runtime behind GitHub Copilot's
# local sandboxing. The daemon spawns sandboxed GGS instances through it instead of
# enforcing a sandbox of its own.
mxc-sdk = "1.0"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
httpdate = "1"
# The Hub client (docs/ggs-remote-plan.md §20): the device key, its sealed export, and the
# outbound tunnel. webpki-roots over rustls-platform-verifier: a static root store, no
# platform bindings; a self-signed Hub pins with fp= instead.
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "0.26"
tower = { version = "0.5", default-features = false, features = ["util"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.21", optional = true }
tao = { version = "0.34", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", optional = true, features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[dev-dependencies]
tempfile = "3"
# The across-crates end-to-end (tests/hub_link.rs): a real Hub against this real daemon.
ggs-remote-hub = { path = "../hub" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# GGS-patch of interprocess (the Boa vendoring precedent in src-tauri/vendor): one added
# method — `ListenerOptions::security_descriptor_sddl` (src/local_socket/listener/options.rs,
# GGS-patch comment) — so the daemon can create its control pipe with a DACL that grants
# ALL APPLICATION PACKAGES, without which a sandboxed instance (an AppContainer token on
# the Windows tier this build ships to) cannot open the pipe at all. No other diff.
[patch.crates-io]
interprocess = { path = "../vendor/interprocess" }
