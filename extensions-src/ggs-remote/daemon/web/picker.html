<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GGS Remote</title>
<link rel="stylesheet" href="static/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="static/icon.svg">
<script src="lang.js"></script>
</head>
<body>
<main>
	<div class="banner" id="banner" hidden></div>
	<section class="card">
		<div class="row">
			<h1 data-i18n="windows"></h1>
			<span class="spacer"></span>
			<button class="danger" id="sign-out" data-i18n="signOut"></button>
		</div>
		<div class="pw-row" id="open-row" style="margin-top:8px">
			<input type="text" id="open-folder" data-i18n-placeholder="folderOptional" data-i18n-aria="folderOptional" autocomplete="off" spellcheck="false">
			<button class="primary" id="open-go" data-i18n="open"></button>
		</div>
		<p class="muted" id="empty" hidden data-i18n="noWindows"></p>
		<div class="windows" id="windows"></div>
		<label class="check" style="margin-top:10px"><input type="checkbox" id="auto-enter"> <span data-i18n="autoEnter"></span></label>
	</section>
	<section class="card" id="recent-card" hidden>
		<h2 data-i18n="recentFolders"></h2>
		<ul class="recent" id="recent"></ul>
	</section>
	<section class="card">
		<details id="settings">
			<summary data-i18n="settings"></summary>
			<h2 data-i18n="changePassword"></h2>
			<form id="password-form">
				<div class="pw-row">
					<input type="password" id="current" autocomplete="current-password" required data-i18n-placeholder="currentPassword" data-i18n-aria="currentPassword">
					<input type="password" id="next" autocomplete="new-password" required minlength="8" data-i18n-placeholder="newPassword" data-i18n-aria="newPassword">
					<button class="primary" data-i18n="save"></button>
				</div>
				<p class="error" id="password-error"></p>
			</form>
			<h2 data-i18n="devices"></h2>
			<ul class="devices" id="devices"></ul>
		</details>
	</section>
</main>
<script type="module" src="static/picker.js"></script>
</body>
</html>
