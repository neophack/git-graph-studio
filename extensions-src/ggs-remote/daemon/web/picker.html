<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GGS Remote</title>
<link rel="stylesheet" href="static/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="static/icon.svg">
</head>
<body>
<main>
	<div class="banner" id="banner" hidden></div>
	<section class="card">
		<div class="row">
			<h1 data-i18n="windows"></h1>
			<span class="spacer"></span>
			<button class="primary" id="new-window" data-i18n="newWindow"></button>
		</div>
		<div class="row" id="new-row" hidden>
			<input type="text" id="new-folder" data-i18n-placeholder="folderOptional">
			<button class="primary" id="new-go" data-i18n="open"></button>
		</div>
		<p class="muted" id="empty" hidden data-i18n="noWindows"></p>
		<div class="windows" id="windows"></div>
		<label class="check"><input type="checkbox" id="auto-enter"> <span data-i18n="autoEnter"></span></label>
	</section>
	<section class="card">
		<details id="settings">
			<summary data-i18n="settings"></summary>
			<h2 data-i18n="devices"></h2>
			<ul class="devices" id="devices"></ul>
			<h2 data-i18n="changePassword"></h2>
			<form id="password-form">
				<label for="current" data-i18n="currentPassword"></label>
				<input type="password" id="current" autocomplete="current-password" required>
				<label for="next" data-i18n="newPassword"></label>
				<input type="password" id="next" autocomplete="new-password" required minlength="8">
				<button data-i18n="save"></button>
				<p class="error" id="password-error"></p>
			</form>
			<button class="danger" id="sign-out" data-i18n="signOut"></button>
		</details>
	</section>
</main>
<script type="module" src="static/picker.js"></script>
</body>
</html>
