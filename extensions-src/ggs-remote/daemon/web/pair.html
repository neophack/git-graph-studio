<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GGS Remote</title>
<link rel="stylesheet" href="static/style.css">
<link rel="icon" href="static/icon.svg">
<script src="lang.js"></script>
</head>
<body>
<main>
	<section class="card">
		<h1 data-i18n="pairTitle"></h1>
		<p class="muted" data-i18n="warning"></p>
		<form id="unlock-form" hidden>
			<p data-i18n="pairLocked"></p>
			<label for="unlock-password" data-i18n="password"></label>
			<input type="password" id="unlock-password" autocomplete="current-password" required autofocus>
			<button class="primary" data-i18n="unlock"></button>
			<p class="error" id="unlock-error"></p>
		</form>
		<form id="first-form" hidden>
			<p data-i18n="setFirst"></p>
			<label for="first-password" data-i18n="newPassword"></label>
			<input type="password" id="first-password" autocomplete="new-password" required minlength="8">
			<button class="primary" data-i18n="setPassword"></button>
			<p class="error" id="first-error"></p>
		</form>
		<div id="unlocked" hidden>
			<p id="links-intro" data-i18n="links"></p>
			<div class="links" id="links"></div>
			<p class="muted" id="foreign"></p>
		</div>
	</section>
	<section class="card" id="relay" hidden>
		<h2 data-i18n="relayTitle"></h2>
		<p class="muted" id="relay-state"></p>
		<form id="relay-form">
			<label for="relay-url" data-i18n="relayAddress"></label>
			<input type="text" id="relay-url" autocomplete="off" spellcheck="false" placeholder="remote.example.com">
			<label for="relay-key" data-i18n="relayKey"></label>
			<input type="password" id="relay-key" autocomplete="off">
			<button class="primary" data-i18n="relaySave"></button>
			<p class="error" id="relay-error"></p>
		</form>
		<button id="relay-disconnect" data-i18n="relayDisconnect" hidden></button>
		<p class="muted" data-i18n="relayHint"></p>
	</section>
	<section class="card" id="lan" hidden>
		<h2 data-i18n="lanTitle"></h2>
		<p class="muted" id="lan-state"></p>
		<form id="lan-form">
			<div class="pw-row lan-row">
				<input type="number" id="lan-port" min="1" max="65535" step="1" required placeholder="47615" data-i18n-aria="lanPort">
				<select id="lan-scheme" data-i18n-aria="lanScheme">
					<option value="https">HTTPS</option>
					<option value="http" data-i18n="lanHttp"></option>
				</select>
				<button class="primary" data-i18n="save"></button>
			</div>
			<p class="error" id="lan-error"></p>
		</form>
		<p class="muted" data-i18n="lanHint"></p>
	</section>
	<section class="card" id="ca" hidden>
		<h2 data-i18n="caTitle"></h2>
		<p><span data-i18n="caText"></span> <code id="fingerprint"></code></p>
		<div class="row">
			<a class="button" id="ca-ios" data-i18n="caIos"></a>
			<a class="button" id="ca-crt" data-i18n="caOther"></a>
		</div>
		<p class="muted" data-i18n="caIosSteps"></p>
	</section>
	<section class="card" id="change" hidden>
		<h2 data-i18n="changePassword"></h2>
		<form id="change-form">
			<div class="pw-row">
				<input type="password" id="change-password" autocomplete="new-password" required minlength="8" data-i18n-placeholder="newPassword" data-i18n-aria="newPassword">
				<button class="primary" data-i18n="save"></button>
			</div>
			<p class="error" id="change-error"></p>
		</form>
	</section>
</main>
<script type="module" src="static/pair.js"></script>
</body>
</html>
