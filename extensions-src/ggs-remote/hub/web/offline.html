<!doctype html>
<!-- The one page every not-online link answers with (docs/ggs-remote-plan.md §20.5):
     identical whether the uuid is mistyped, unknown, or the PC is merely away — the Hub
     cannot tell either, and neither can whoever is probing. Retries itself every 15 s. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- The no-script fallback; the script below removes it and polls softly instead, so the
     page never flashes a full reload while it waits. The cadence stays at 15 s on purpose:
     the Hub holds an offline-probe budget of 100 per IP per 10 minutes (§20.6). -->
<meta http-equiv="refresh" content="15">
<title>GGS Remote — not online</title>
<style>
:root { color-scheme: light dark; }
body {
	margin: 0; min-height: 100vh; display: grid; place-items: center;
	font: 16px/1.6 system-ui, sans-serif; text-align: center; padding: 24px;
}
.card { max-width: 28em; }
.dot {
	width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 20px;
	background: radial-gradient(circle at 35% 30%, #7a7a7a, #4a4a4a);
	opacity: .8;
}
@media (prefers-reduced-motion: no-preference) {
	.dot { animation: breathe 4s ease-in-out infinite; }
	@keyframes breathe { 50% { opacity: .35; } }
}
h1 { font-size: 1.25rem; margin: 0 0 .6em; }
p { margin: .4em 0; opacity: .85; }
.retry { font-size: .85em; opacity: .6; }
</style>
</head>
<body>
<main class="card">
	<div class="dot"></div>
	<h1>This PC is not online</h1>
	<p>The link is correct, but the PC it belongs to is not connected to the relay right now.</p>
	<p>它现在没有连上中继服务器——等这台电脑上线后自动恢复。</p>
	<p class="retry">Checking the link…</p>
</main>
<script>
(() => {
	'use strict';
	document.querySelector('meta[http-equiv="refresh"]').remove();
	let checked = 0;
	const check = async () => {
		const now = Date.now();
		if (now - checked < 5000) return; // a focus burst is not a poll burst
		checked = now;
		try {
			const answer = await fetch(location.href, { cache: 'no-store', credentials: 'same-origin' });
			// Anything but this page means the PC is answering again — the reload lands
			// wherever its daemon sends us (the sign-in, or straight to the workbench).
			// No per-render text changes on purpose: the page stays byte-identical for
			// every not-online link (§20.5's enumeration guard).
			if (answer.status !== 503) location.replace(location.href);
		} catch {
			/* the relay itself hiccupped; the next round tries again */
		}
	};
	setInterval(check, 15000);
	document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
})();
</script>
</body>
</html>
