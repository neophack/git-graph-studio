[package]
name = "ggs-remote-hub"
version = "0.1.0"
description = "GGS Remote Hub: a self-hosted, account-free relay — each PC's daemon keeps an outbound tunnel, each PC gets its own https://<host>/u/<uuid>/ link (docs/ggs-remote-plan.md §20)"
edition = "2021"
rust-version = "1.94"
license = "MIT"
publish = false

# Its own workspace: not part of the VSIX, not linked by anything; released as a static binary
# and a container image.
[workspace]

[[bin]]
name = "ggs-remote-hub"
path = "src/main.rs"

[lib]
name = "ggs_remote_hub"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio", "query"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tower-service = "0.3"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1.3"
toml = "0.8"
ed25519-dalek = "2"
sha2 = "0.10"
uuid = "1"
subtle = "2.6"
getrandom = "0.3"
httpdate = "1"

[dev-dependencies]
tokio-tungstenite = "0.26"
ed25519-dalek = "2"
sha2 = "0.10"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
