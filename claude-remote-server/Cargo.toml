[package]
name = "claude-remote-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Claude Remote relay: routes end-to-end encrypted frames between a PC's Claude Remote windows and its paired phones"
license = "MIT"
publish = false

[[bin]]
name = "claude-remote-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
getrandom = "0.2"

[dev-dependencies]
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
