# Releases Git Graph Studio: builds every installer through studio.yml (stamping the tag's
# version into the binaries), then publishes them as a GitHub Release with SHA256 checksums.
#
# Trigger: push a v-prefixed tag (the normal path - the tag pins the exact commit being
# released):
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# or run it from the Actions tab ("Release" -> "Run workflow") with a version (bare or
# v-prefixed; empty = package.json's version) - the tag is then created at the workflow's
# commit. Check `full` to also build the macOS x64 dmg.
#
# The extension checkboxes decide which packages are packed INTO the installers
# (studio.yml's GGS_BUNDLE_* env): both checked by default (2026-11-07, the owner's
# direction — claude-code rode in none by default until then, the Extensions view's
# marketplace row installing it on demand). A pushed tag takes the same defaults.
#
# Artifacts per release: windows NSIS setup exe (the one Windows format; the MSI was
# dropped 2026-10-14 at the owner's direction), deb x64 and arm64 (Ubuntu 22.04-26.04 /
# Debian 12/13; the arm64 deb is the same ubuntu:22.04 floor container on an arm64
# runner), rpm (Fedora 38+ / openSUSE Leap 15.6+), macOS arm64 dmg (+ x64 on `full`),
# each with its SHA256 in SHA256SUMS, plus the build's metrics.json - nothing else (no
# bundler work files). The Linux compatibility floor is each installer's build container
# (ubuntu:22.04 for the deb, fedora:38 for the rpm - see studio.yml; nothing older than
# Ubuntu 22.04 is reachable: the app hard-requires the host's libwebkit2gtk-4.1 at
# runtime); the same containers serve local builds through scripts/build-studio-linux.bat.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (bare or v-prefixed, e.g. v0.2.0; empty = package.json version)'
        required: false
        default: ''
        type: string
      full:
        description: 'Also build macOS x64'
        required: false
        default: false
        type: boolean
      bundle-git-graph:
        description: 'Pack git-graph-rs into the installers'
        required: false
        default: true
        type: boolean
      bundle-claude-code:
        description: 'Pack claude-code into the installers'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The version must be known before the pipeline runs, because the builds inside it stamp
  # the installers with it: the `version` input, else the tag being pushed, else
  # package.json's version.
  resolve-tag:
    name: Resolve the release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          VERSION="$INPUT_VERSION"
          # The input "main" means "resolve it" (a branch name is never a semver). And a
          # branch dispatch has no version in its name — only a pushed TAG does. The old
          # fallback took REF_NAME for an empty (or literal "main") input on ANY ref, so
          # dispatching on the main branch resolved the version to "main" and stamped
          # `version = "main"` into every Cargo.toml the build touches (2026-11-14: all
          # the stamping jobs died at cargo metadata while the tests passed).
          if [ "$VERSION" = "main" ]; then
            VERSION=""
          fi
          if [ -z "$VERSION" ] && [ "$REF_TYPE" = "tag" ]; then
            VERSION="$REF_NAME"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Everything studio.yml does: the test suite, then the installers for every platform,
  # stamped with the release version. A release is only made when all of it passes.
  # secrets: inherit is what carries the signing secrets (APPLE_* / WINDOWS_* /
  # GPG_PRIVATE_KEY) into the called workflow — without it the installers build ad-hoc /
  # unsigned even with every secret configured.
  build-and-test:
    name: Build the installers
    needs: resolve-tag
    uses: ./.github/workflows/studio.yml
    secrets: inherit
    # The grant the called workflow's jobs may never exceed: contents: read is every
    # called job's whole need (checkout alone). This block once carried actions: write
    # for studio.yml's cache-prune (2026-11-19, run 44433763609 — without it every
    # Release dispatch died as a 4-second startup_failure before a single job started;
    # a direct push run never saw that, because it grants its own job-level scopes);
    # prune was retired with the Linux build cache it guarded the same day, and the
    # caller's grant shrunk with it.
    permissions:
      contents: read
    with:
      full: ${{ inputs.full == true }}
      studio-version: ${{ needs.resolve-tag.outputs.version }}
      # A pushed tag carries no dispatch inputs at all, and a null input reads as false
      # against the loose == (both null and false cast to 0) — so the push branch passes
      # the checked-by-default booleans straight through; a dispatch run forwards its
      # checkboxes as-is (studio.yml's call defaults stand behind them).
      bundle-git-graph: ${{ github.event_name == 'push' && true || inputs.bundle-git-graph }}
      bundle-claude-code: ${{ github.event_name == 'push' && true || inputs.bundle-claude-code }}

  # The Hub's standalone packages (docs/ggs-remote-plan.md §20.9): a Windows zip you unzip
  # and run beside its example config, and debs + tarballs around the static musl binaries
  # (amd64 + arm64, each compiled natively on its own runner — no QEMU) — zero glibc
  # dependency — whose example config lands at /etc/ggs-hub/hub.toml as a conffile, so
  # dpkg -i plus systemctl enable --now runs out of the box. The two static Linux binaries
  # are also uploaded for `hub-image` below so the multi-arch container image repackages
  # them directly into FROM scratch without compiling twice or paying QEMU emulation.
  # Gated on the tests like every other release artifact (build-and-test runs remote-hub-test).
  hub-packages:
    name: Hub standalone packages (${{ matrix.arch }})
    needs: [resolve-tag, build-and-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: windows-x64
            rust_target: ''
          - os: ubuntu-latest
            arch: amd64
            rust_target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            arch: arm64
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extensions-src/ggs-remote/hub
    steps:
      - uses: actions/checkout@v6

      # The pinned toolchain (rust-toolchain.toml); keep ref and file in sync on a bump.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extensions-src/ggs-remote/hub -> ../../../target/studio/ggs-remote-hub
          key: ggs-remote-hub-release-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the deb and the tarball
        if: runner.os == 'Linux'
        # bash *.sh, never the bare script — the repo's convention (2026-10-14, the
        # owner's direction): a .sh committed from Windows carries no executable bit,
        # and a direct invocation dies with Permission denied (exit 126).
        run: TARGET=${{ matrix.rust_target }} VERSION=${{ needs.resolve-tag.outputs.version }} bash deploy/build-deb.sh

      - name: Build the windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        # The crate's .cargo/config.toml pins [build] target-dir to the repository's
        # target/studio/ggs-remote-hub (one target dir per remote crate, 2026-11-18) — the
        # binary lands there, never in a shadow target/ of the crate's own, so the build
        # says so explicitly and the copy reads the same place (studio.yml's hub job and
        # its rust-cache use this mapping too).
        run: |
          cargo build --release --target-dir ../../../target/studio/ggs-remote-hub
          $version = "${{ needs.resolve-tag.outputs.version }}"
          $stage = "target/packages/stage/ggs-remote-hub-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item ../../../target/studio/ggs-remote-hub/release/ggs-remote-hub.exe $stage/
          Copy-Item deploy/hub.example.toml "$stage/hub.toml.example"
          Copy-Item README.md $stage/
          Compress-Archive -Path $stage -DestinationPath "target/packages/ggs-remote-hub-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: hub-package-${{ matrix.arch }}
          path: extensions-src/ggs-remote/hub/target/packages/*.deb
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: hub-package-${{ matrix.arch }}-misc
          path: |
            extensions-src/ggs-remote/hub/target/packages/*.tar.gz
            extensions-src/ggs-remote/hub/target/packages/*.zip
          if-no-files-found: ignore
      # Static musl binary for hub-image (named hub-bin-*, outside hub-package-* so the
      # GitHub Release job below never attaches the bare binary).
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: hub-bin-${{ matrix.arch }}
          path: target/studio/ggs-remote-hub/${{ matrix.rust_target }}/release/ggs-remote-hub
          if-no-files-found: error

  # The Hub's container image (ggs-remote-plan.md §20.9 / M9.9): pushed to GHCR for both
  # server architectures under the release version. Repackages the statically linked musl
  # binaries that `hub-packages` already compiled natively on amd64 and arm64 runners —
  # zero QEMU emulation, zero duplicate Rust release build, and no buildx GHA cache bloat.
  hub-image:
    name: Publish the Hub image
    needs: [resolve-tag, hub-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Download the prebuilt amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: hub-bin-amd64
          path: hub-context/linux-amd64

      - name: Download the prebuilt arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: hub-bin-arm64
          path: hub-context/linux-arm64

      - name: Verify the prebuilt binaries
        run: |
          chmod +x hub-context/linux-amd64/ggs-remote-hub hub-context/linux-arm64/ggs-remote-hub
          file hub-context/linux-amd64/ggs-remote-hub hub-context/linux-arm64/ggs-remote-hub

      # GHCR image names are lowercase-only; the owner's display case may not be.
      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: hub-context
          file: extensions-src/ggs-remote/hub/deploy/Dockerfile.prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/ggs-remote-hub:v${{ needs.resolve-tag.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.owner }}/ggs-remote-hub:latest

  release:
    name: Publish the GitHub Release
    needs: [resolve-tag, build-and-test, hub-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Download every installer
        uses: actions/download-artifact@v8
        with:
          pattern: studio-*
          merge-multiple: true
          path: artifacts

      # The Hub's standalone packages join the same release (and its checksums).
      - name: Download the hub packages
        uses: actions/download-artifact@v8
        with:
          pattern: hub-package-*
          merge-multiple: true
          path: hubpkgs

      # Flatten (the artifacts keep their bundle/... structure) and checksum everything;
      # SHA256SUMS lists exactly the files attached to the release. Only installers and
      # metrics.json are taken - the v0.1.1 release carried every bundler work file that
      # had slipped into an artifact, so this filter stays as the release page's guard.
      # The installers are version-gated too (2026-11-19): a warm build cache once handed
      # the artifact the previous releases' bundles (v0.1.21 shipped 0.1.19/0.1.20 debs
      # and rpms), and an extension-only filter passes those straight through. metrics.json
      # and the hub packages carry no such ambiguity beyond the version every hub file
      # already names.
      - name: Flatten and checksum
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          mkdir flat
          find artifacts -type f \( \
            \( -name "*${VERSION}*" \( \
              -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \
            \) \) -o -name 'metrics.json' \) -exec cp {} flat/ \;
          find hubpkgs -type f -name "*${VERSION}*" -exec cp {} flat/ \;
          cd flat
          sha256sum * > SHA256SUMS
          ls -l

      # A detached GPG signature over the checksums (verify: `gpg --verify SHA256SUMS.asc
      # SHA256SUMS`) — the one signature every platform's download can be checked
      # against, the Linux packages included (deb/rpm carry no Authenticode-style
      # signature of their own). Wired only when the GPG_PRIVATE_KEY secret exists;
      # without it the release ships the checksums alone, exactly as before.
      - name: Sign the checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --local-user "$KEYID" --detach-sign --armor flat/SHA256SUMS
          ls -l flat/

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-tag.outputs.version }}
          name: Git Graph Studio v${{ needs.resolve-tag.outputs.version }}
          # The install hint the auto-generated notes never carry: while the signing
          # secrets are unconfigured the macOS dmg has only the ad-hoc seal, so a
          # browser-downloaded copy is quarantined — README § Installing a macOS release.
          body: |
            **macOS**: while the dmg carries only the ad-hoc seal (no Developer ID), a
            browser-downloaded copy is quarantined. After dragging **Git Graph Studio.app**
            to `/Applications`, clear it once:

            ```
            xattr -dr com.apple.quarantine "/Applications/Git Graph Studio.app"
            ```

            Or skip quarantine entirely — install with curl, which never sets it
            (and clears any it finds):

            ```
            curl -fsSL https://raw.githubusercontent.com/neophack/git-graph-studio/main/scripts/install-macos.sh | sh
            ```
          generate_release_notes: true
          draft: false
          files: flat/*
