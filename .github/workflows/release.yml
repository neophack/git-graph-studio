# Releases Git Graph Studio: builds every installer through studio.yml (stamping the tag's
# version into the binaries), then publishes them as a GitHub Release with SHA256 checksums.
#
# Trigger: push a v-prefixed tag (the normal path - the tag pins the exact commit being
# released):
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# or run it from the Actions tab ("Release" -> "Run workflow") with a version (bare or
# v-prefixed; empty = package.json's version) - the tag is then created at the workflow's
# commit. Check `full` to also build the macOS x64 dmg.
#
# The extension checkboxes decide which packages are packed INTO the installers
# (studio.yml's GGS_BUNDLE_* env): `bundle-git-graph` checked by default,
# `bundle-claude-code` unchecked by default (its 100+ MB platform VSIX stays out of
# the installers; the Extensions view's marketplace row installs it on demand).
# A pushed tag takes the same defaults.
#
# Artifacts per release: windows NSIS setup exe (the one Windows format; the MSI was
# dropped 2026-10-14 at the owner's direction), deb (Ubuntu 22.04-26.04 / Debian
# 12/13), rpm (Fedora 38+ / openSUSE Leap 15.6+), macOS arm64 dmg (+ x64 on `full`), each
# with its SHA256 in SHA256SUMS, plus the build's metrics.json - nothing else (no
# bundler work files). The Linux compatibility floor is each installer's build container
# (ubuntu:22.04 for the deb, fedora:38 for the rpm - see studio.yml); the same containers
# serve local builds through scripts/build-studio-linux.bat.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (bare or v-prefixed, e.g. v0.2.0; empty = package.json version)'
        required: false
        default: ''
        type: string
      full:
        description: 'Also build macOS x64'
        required: false
        default: false
        type: boolean
      bundle-git-graph:
        description: 'Pack git-graph-rs into the installers'
        required: false
        default: true
        type: boolean
      bundle-claude-code:
        description: 'Pack claude-code into the installers'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The version must be known before the pipeline runs, because the builds inside it stamp
  # the installers with it: the `version` input, else the tag being pushed, else
  # package.json's version.
  resolve-tag:
    name: Resolve the release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="$REF_NAME"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Everything studio.yml does: the test suite, then the installers for every platform,
  # stamped with the release version. A release is only made when all of it passes.
  # secrets: inherit is what carries the signing secrets (APPLE_* / WINDOWS_* /
  # GPG_PRIVATE_KEY) into the called workflow — without it the installers build ad-hoc /
  # unsigned even with every secret configured.
  build-and-test:
    name: Build the installers
    needs: resolve-tag
    uses: ./.github/workflows/studio.yml
    secrets: inherit
    with:
      full: ${{ inputs.full == true }}
      studio-version: ${{ needs.resolve-tag.outputs.version }}
      # `!= false` / `== true` so a tag push (no dispatch inputs at all) falls through
      # to studio.yml's own defaults: git-graph-rs packed, claude-code not.
      bundle-git-graph: ${{ inputs.bundle-git-graph != false }}
      bundle-claude-code: ${{ inputs.bundle-claude-code == true }}

  # The Hub's container image (ggs-remote-plan.md §20.9 / M9.9): the same Dockerfile
  # hub/deploy/ serves locally, pushed to GHCR for both server architectures under the
  # release version. Gated on the tests like every other release artifact — the called
  # studio.yml runs remote-hub-test — and it never enters the installers (the Hub is a
  # server-side deploy, not an app component).
  hub-image:
    name: Publish the Hub image
    needs: [resolve-tag, build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR image names are lowercase-only; the owner's display case may not be.
      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: extensions-src/ggs-remote/hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/ggs-remote-hub:v${{ needs.resolve-tag.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.owner }}/ggs-remote-hub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Hub's standalone packages (docs/ggs-remote-plan.md §20.9): a Windows zip you unzip
  # and run beside its example config, and a deb around the static musl binary — zero
  # glibc dependency — whose example config lands at /etc/ggs-hub/hub.toml as a conffile,
  # so dpkg -i plus systemctl enable --now runs out of the box. A plain tarball rides
  # along for every Linux that is not a Debian. Gated on the tests like every other
  # release artifact (build-and-test runs remote-hub-test).
  hub-packages:
    name: Hub standalone packages (${{ matrix.os }})
    needs: [resolve-tag, build-and-test]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extensions-src/ggs-remote/hub
    steps:
      - uses: actions/checkout@v4

      # The pinned toolchain (rust-toolchain.toml); keep ref and file in sync on a bump.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the deb and the tarball
        if: runner.os == 'Linux'
        # bash *.sh, never the bare script — the repo's convention (2026-10-14, the
        # owner's direction): a .sh committed from Windows carries no executable bit,
        # and a direct invocation dies with Permission denied (exit 126).
        run: VERSION=${{ needs.resolve-tag.outputs.version }} bash deploy/build-deb.sh

      - name: Build the windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          $version = "${{ needs.resolve-tag.outputs.version }}"
          $stage = "target/packages/stage/ggs-remote-hub-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/ggs-remote-hub.exe $stage/
          Copy-Item deploy/hub.example.toml "$stage/hub.toml.example"
          Copy-Item README.md $stage/
          Compress-Archive -Path $stage -DestinationPath "target/packages/ggs-remote-hub-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: hub-package-${{ matrix.os }}
          path: extensions-src/ggs-remote/hub/target/packages/*.deb
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: hub-package-${{ matrix.os }}-misc
          path: |
            extensions-src/ggs-remote/hub/target/packages/*.tar.gz
            extensions-src/ggs-remote/hub/target/packages/*.zip
          if-no-files-found: ignore

  release:
    name: Publish the GitHub Release
    needs: [resolve-tag, build-and-test, hub-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Download every installer
        uses: actions/download-artifact@v4
        with:
          pattern: studio-*
          merge-multiple: true
          path: artifacts

      # The Hub's standalone packages join the same release (and its checksums).
      - name: Download the hub packages
        uses: actions/download-artifact@v4
        with:
          pattern: hub-package-*
          merge-multiple: true
          path: hubpkgs

      # Flatten (the artifacts keep their bundle/... structure) and checksum everything;
      # SHA256SUMS lists exactly the files attached to the release. Only installers and
      # metrics.json are taken - the v0.1.1 release carried every bundler work file that
      # had slipped into an artifact, so this filter stays as the release page's guard.
      - name: Flatten and checksum
        run: |
          mkdir flat
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.dmg' -o -name 'metrics.json' \) -exec cp {} flat/ \;
          find hubpkgs -type f -exec cp {} flat/ \;
          cd flat
          sha256sum * > SHA256SUMS
          ls -l

      # A detached GPG signature over the checksums (verify: `gpg --verify SHA256SUMS.asc
      # SHA256SUMS`) — the one signature every platform's download can be checked
      # against, the Linux packages included (deb/rpm carry no Authenticode-style
      # signature of their own). Wired only when the GPG_PRIVATE_KEY secret exists;
      # without it the release ships the checksums alone, exactly as before.
      - name: Sign the checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --local-user "$KEYID" --detach-sign --armor flat/SHA256SUMS
          ls -l flat/

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-tag.outputs.version }}
          name: Git Graph Studio v${{ needs.resolve-tag.outputs.version }}
          generate_release_notes: true
          draft: false
          files: flat/*
