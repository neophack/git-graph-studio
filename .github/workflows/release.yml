# Releases Git Graph Studio: builds every installer through studio.yml (stamping the tag's
# version into the binaries), then publishes them as a GitHub Release with SHA256 checksums.
#
# Trigger: push a v-prefixed tag (the normal path - the tag pins the exact commit being
# released):
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# or run it from the Actions tab ("Release" -> "Run workflow") with a version (bare or
# v-prefixed; empty = package.json's version) - the tag is then created at the workflow's
# commit. Check `full` to also build the macOS x64 dmg.
#
# The extension checkboxes decide which packages are packed INTO the installers
# (studio.yml's GGS_BUNDLE_* env): `bundle-git-graph` and `bundle-claude-remote` (local
# source) checked by default, `bundle-claude-code` unchecked by default (its 100+ MB
# platform VSIX stays out of the installers; the Extensions view's marketplace row
# installs it on demand). A pushed tag takes the same defaults.
#
# Artifacts per release: windows NSIS setup exe + MSI, deb (Ubuntu 22.04-26.04 / Debian
# 12/13), rpm (Fedora 38+ / openSUSE Leap 15.6+), macOS arm64 dmg (+ x64 on `full`), each
# with its SHA256 in SHA256SUMS, plus the build's metrics.json - nothing else (no
# bundler work files). The Linux compatibility floor is each installer's build container
# (ubuntu:22.04 for the deb, fedora:38 for the rpm - see studio.yml); the same containers
# serve local builds through scripts/build-studio-linux.bat.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (bare or v-prefixed, e.g. v0.2.0; empty = package.json version)'
        required: false
        default: ''
        type: string
      full:
        description: 'Also build macOS x64'
        required: false
        default: false
        type: boolean
      bundle-git-graph:
        description: 'Pack git-graph-rs into the installers'
        required: false
        default: true
        type: boolean
      bundle-claude-code:
        description: 'Pack claude-code into the installers'
        required: false
        default: false
        type: boolean
      bundle-claude-remote:
        description: 'Pack claude-remote (local source) into the installers'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The version must be known before the pipeline runs, because the builds inside it stamp
  # the installers with it: the `version` input, else the tag being pushed, else
  # package.json's version.
  resolve-tag:
    name: Resolve the release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="$REF_NAME"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Everything studio.yml does: the test suite, then the installers for every platform,
  # stamped with the release version. A release is only made when all of it passes.
  # secrets: inherit is what carries the signing secrets (APPLE_* / WINDOWS_* /
  # GPG_PRIVATE_KEY) into the called workflow — without it the installers build ad-hoc /
  # unsigned even with every secret configured.
  build-and-test:
    name: Build the installers
    needs: resolve-tag
    uses: ./.github/workflows/studio.yml
    secrets: inherit
    with:
      full: ${{ inputs.full == true }}
      studio-version: ${{ needs.resolve-tag.outputs.version }}
      # `!= false` / `== true` so a tag push (no dispatch inputs at all) falls through
      # to studio.yml's own defaults: git-graph-rs and claude-remote packed,
      # claude-code not.
      bundle-git-graph: ${{ inputs.bundle-git-graph != false }}
      bundle-claude-code: ${{ inputs.bundle-claude-code == true }}
      bundle-claude-remote: ${{ inputs.bundle-claude-remote != false }}

  release:
    name: Publish the GitHub Release
    needs: [resolve-tag, build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Download every installer
        uses: actions/download-artifact@v4
        with:
          pattern: studio-*
          merge-multiple: true
          path: artifacts

      # Flatten (the artifacts keep their bundle/... structure) and checksum everything;
      # SHA256SUMS lists exactly the files attached to the release. Only installers and
      # metrics.json are taken - the v0.1.1 release carried every bundler work file that
      # had slipped into an artifact, so this filter stays as the release page's guard.
      - name: Flatten and checksum
        run: |
          mkdir flat
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.dmg' -o -name 'metrics.json' \) -exec cp {} flat/ \;
          cd flat
          sha256sum * > SHA256SUMS
          ls -l

      # A detached GPG signature over the checksums (verify: `gpg --verify SHA256SUMS.asc
      # SHA256SUMS`) — the one signature every platform's download can be checked
      # against, the Linux packages included (deb/rpm carry no Authenticode-style
      # signature of their own). Wired only when the GPG_PRIVATE_KEY secret exists;
      # without it the release ships the checksums alone, exactly as before.
      - name: Sign the checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --local-user "$KEYID" --detach-sign --armor flat/SHA256SUMS
          ls -l flat/

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-tag.outputs.version }}
          name: Git Graph Studio v${{ needs.resolve-tag.outputs.version }}
          generate_release_notes: true
          draft: false
          files: flat/*
