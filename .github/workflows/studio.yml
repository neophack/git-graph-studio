# Git Graph Studio's CI: the frontend test suite plus the per-platform installer builds.
#
# The app is self-contained except for the vscode-git-graph-rs/ submodule: its compiled
# webview assets (media/, out/) feed prepare.mjs, so every job checks the submodule out and
# the installer jobs compile it first.
#
# Tests gate the installers: every installer job runs clippy and the backend test suite
# first, and `tauri build` only starts after the last test passed. The dependency graph is
# compiled twice per platform - dev for the tests, release for the installers - because
# `panic = "abort"` in the size-diet [profile.release] (src-tauri/Cargo.toml) can never be
# shared with test targets, which always unwind; dropping it to share one compile was
# rejected (verified experimentally, 2026-09-15). What IS shared: the two Linux package
# formats bundle the single release binary from one build, and rust-cache keeps the target
# dir and the crates.io registry warm across runs (fewer downloads, near-incremental
# rebuilds); npm downloads are cached the same way through setup-node's cache.
#
# The Linux installers are built natively on the pinned ubuntu-24.04 runner - no containers
# (the old container path spent every run re-pulling the base image and reinstalling its
# packages). The runner's toolchain defines the compatibility floor, glibc 2.39:
#   deb -> Ubuntu 24.04-26.04, Debian 13+, Mint 22+, Pop!_OS 24.04+
#   rpm -> Fedora 40+, openSUSE Leap 16+/Tumbleweed
# The older ubuntu:22.04 / fedora:38 container floors remain available for local builds
# through scripts/build-studio-linux.bat. The runner is pinned, not ubuntu-latest, so a
# future `latest` flip cannot move the floor silently - and the ubuntu-22.04 image begins
# its GitHub retirement on 2026-09-17 regardless.
#
# Pull requests run the tests only; the installers build on push to main, on dispatch, and
# when release.yml calls this workflow with `studio-version` to stamp the version being
# published (`full` adds the niche macOS x64 platform).

name: Studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Also build macOS x64'
        required: false
        default: false
        type: boolean
      studio-version:
        description: 'Version to stamp into the build (empty = keep the sources version)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      full:
        required: false
        default: false
        type: boolean
      studio-version:
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Incremental compilation only pays off within a single job and the caches below discard it
# anyway; turning it off speeds the clippy pass and shrinks the saved caches.
env:
  CARGO_INCREMENTAL: "0"

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The app's frontend: typecheck plus the vitest suite from tests/, which runs against a
  # mocked Tauri backend (tests/tauriMock.ts), so neither Rust nor the compiled extension
  # assets are needed here - only the submodule manifest the baked contributions read.
  studio-test:
    name: Studio tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-git-graph-rs/package-lock.json

      - name: Install app dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run

  # The Windows installers (NSIS setup exe + MSI), built natively.
  studio-windows:
    name: Studio installers (windows-x64)
    runs-on: windows-latest
    # A cold-cache run (first run after a Cargo.lock change) fits in ~2.5 h; fail fast on
    # a real hang instead of burning GitHub's 6 h default.
    timeout-minutes: 180
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      # src-tauri redirects cargo's target dir to ../target/studio/cargo (its
      # .cargo/config.toml); rust-cache caches <workspace>/target unless the mapping is
      # explicit. Mapping it keeps the release artifacts (shared by the test pass and the
      # installer build below) and the registry cache warm across runs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../target/studio/cargo
          key: studio-windows-x64
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-git-graph-rs/package-lock.json

      # The app consumes the extension's own build products (media/out.min.js, out/config.js,
      # resources/), so the submodule must be compiled before prepare.mjs runs.
      - name: Build the vscode-git-graph-rs submodule
        working-directory: vscode-git-graph-rs
        run: |
          npm ci || npm install
          npm run compile

      - name: Install app dependencies
        run: npm ci || npm install

      # Release runs only: sync the app's version with the tag before anything reads it.
      # Stamped after `npm ci` so the lockfile check still sees the sources' version.
      # bash on every runner (Windows included) so the script is identical everywhere.
      - name: Stamp the release version
        if: inputs.studio-version != ''
        shell: bash
        env:
          STUDIO_VERSION: ${{ inputs.studio-version }}
        run: |
          VERSION="${STUDIO_VERSION#v}"
          npm pkg set version="$VERSION"
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = process.argv[1];
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            const cargo = 'src-tauri/Cargo.toml';
            fs.writeFileSync(cargo, fs.readFileSync(cargo, 'utf8').replace(/^version = \"[^\"]*\"/m, 'version = \"' + process.argv[1] + '\"'));
          " "$VERSION"

      # `tauri::generate_context!()` embeds the window icons from tauri.conf.json at compile
      # time, and prepare.mjs is what derives them into target/studio/icons/ - `tauri build`
      # runs it as its beforeBuildCommand, but the test step below compiles first.
      - name: Prepare the app assets
        run: node scripts/prepare.mjs

      # The app crate is its own workspace (see src-tauri/Cargo.toml), so the submodule
      # repository's `cargo test --workspace` never reaches it: its tests, the backend
      # binary's protocol test against the real executable, and clippy run here - before
      # the installer build, which only starts if every test passed.
      - name: Test and lint the app backend
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
        env:
          GGS_PERF_FILES: '20000'

      - name: Build the installers (NSIS + MSI)
        run: npx tauri build

      # Size and performance measurement (docs/ggs-development-plan.md M1.7; the budgets
      # were removed 2026-09-15 — sizes are recorded, not gated): the artefact sizes plus
      # the backend's headless probes on the submodule repository. The metrics land in
      # target/studio/metrics.json and are published with the bundles.
      - name: Measure sizes and performance
        run: node scripts/measure.mjs --repo vscode-git-graph-rs

      - uses: actions/upload-artifact@v4
        with:
          name: studio-windows-x64
          path: |
            target/studio/cargo/release/bundle/
            target/studio/metrics.json
          if-no-files-found: error

  # The Linux installers (deb + rpm), built natively on the pinned ubuntu-24.04 runner (see
  # the header note): one job, one release compile - both package formats bundle the same
  # binary - gated by the backend tests. Ubuntu's `rpm` package provides the rpmbuild the
  # rpm bundler shells out to - the only addition beyond the deb dependencies.
  studio-linux:
    name: Studio installers (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      # Same target-dir mapping as the Windows job (see its comment): one warm cache for
      # the registry and the release artifacts both passes share.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../target/studio/cargo
          key: studio-linux-x64
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-git-graph-rs/package-lock.json

      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm

      - name: Build the vscode-git-graph-rs submodule
        working-directory: vscode-git-graph-rs
        run: |
          npm ci || npm install
          npm run compile

      - name: Install app dependencies
        run: npm ci || npm install

      - name: Stamp the release version
        if: inputs.studio-version != ''
        env:
          STUDIO_VERSION: ${{ inputs.studio-version }}
        run: |
          VERSION="${STUDIO_VERSION#v}"
          npm pkg set version="$VERSION"
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = process.argv[1];
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            const cargo = 'src-tauri/Cargo.toml';
            fs.writeFileSync(cargo, fs.readFileSync(cargo, 'utf8').replace(/^version = \"[^\"]*\"/m, 'version = \"' + process.argv[1] + '\"'));
          " "$VERSION"

      # The window icons generate_context!() embeds, as in the Windows job.
      - name: Prepare the app assets
        run: node scripts/prepare.mjs

      # Native Linux coverage of the app crate (the Windows job runs the same suite on
      # Windows) - before the installer build, which only starts if every test passed.
      - name: Test and lint the app backend
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
        env:
          GGS_PERF_FILES: '20000'

      # Bundles the one release binary into both package formats.
      - name: Build the installers (deb + rpm)
        run: npx tauri build --bundles deb,rpm

      # Size measurement + backend probes. The bundles already sit under
      # target/studio/cargo/release/bundle/ where measure.mjs expects them.
      - name: Measure sizes and performance
        run: node scripts/measure.mjs --repo vscode-git-graph-rs

      - uses: actions/upload-artifact@v4
        with:
          name: studio-linux-x64
          path: target/studio/cargo/release/bundle/deb/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: studio-linux-rpm
          path: target/studio/cargo/release/bundle/rpm/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: studio-linux-metrics
          path: target/studio/metrics.json
          if-no-files-found: error

  # The macOS installers (dmg), built natively; macOS x64 joins on a `full` run.
  studio-macos:
    name: Studio installers (${{ matrix.artifact }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.full == true) && '[{"os":"macos-latest","artifact":"studio-darwin-arm64"},{"os":"macos-13","artifact":"studio-darwin-x64"}]' || '[{"os":"macos-latest","artifact":"studio-darwin-arm64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      # Same target-dir mapping as the Windows job (see its comment).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../target/studio/cargo
          key: studio-${{ matrix.artifact }}
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-git-graph-rs/package-lock.json

      - name: Build the vscode-git-graph-rs submodule
        working-directory: vscode-git-graph-rs
        run: |
          npm ci || npm install
          npm run compile

      - name: Install app dependencies
        run: npm ci || npm install

      - name: Stamp the release version
        if: inputs.studio-version != ''
        env:
          STUDIO_VERSION: ${{ inputs.studio-version }}
        run: |
          VERSION="${STUDIO_VERSION#v}"
          npm pkg set version="$VERSION"
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = process.argv[1];
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            const cargo = 'src-tauri/Cargo.toml';
            fs.writeFileSync(cargo, fs.readFileSync(cargo, 'utf8').replace(/^version = \"[^\"]*\"/m, 'version = \"' + process.argv[1] + '\"'));
          " "$VERSION"

      - name: Build the installers (dmg)
        run: npx tauri build

      - name: Measure sizes and performance
        run: node scripts/measure.mjs --repo vscode-git-graph-rs

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/studio/cargo/release/bundle/
            target/studio/metrics.json
          if-no-files-found: error
