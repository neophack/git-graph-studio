# Git Graph Studio's CI: the frontend test suite, the per-platform backend test jobs, and
# the per-platform installer builds — tests and packaging run as PARALLEL jobs
# (docs/ci-speed-plan.md P2, 2026-10-14): the wall clock is the max of the two, not the
# sum. The tests still gate every release: release.yml calls this workflow and its publish
# step waits for the whole call to pass, and a direct run fails when a test job fails —
# only the (never published) build artifacts of the failed run exist.
#
# The app is self-contained: every marketplace extension package an installer carries
# arrives as the per-architecture VSIX (Open VSX, fetched by scripts/
# fetch-marketplace-extensions.mjs inside prepare.mjs). No job checks anything beyond
# this repository out.
#
# The test jobs compile the dev/test profile only (prepare.mjs --icons-only supplies the
# one compile-time input, the window icons `generate_context!()` embeds); the installer
# jobs compile release only (tauri build's beforeBuildCommand runs the full prepare: the
# ggs-node sidecar, the GGS Remote daemon, the marketplace fetch). One backend test pass
# per platform (the owner's direction, 2026-10-14): test-windows, test-linux (the native
# deb-side runner — rpm and deb are both Linux, the rpm container leg only packages, the
# suite is not run twice) and test-macos (the suite had never run on macOS before it).
# The dependency graph
# is still compiled twice per platform - dev for the tests, release for the installers -
# because `panic = "abort"` in the size-diet [profile.release] (src-tauri/Cargo.toml) can
# never be shared with test targets, which always unwind; dropping it to share one
# compile was rejected (verified experimentally, 2026-09-15). The two halves keep
# separate rust-cache keys so neither restores the other's dead weight. What IS shared:
# rust-cache keeps the target dirs and the crates.io registry warm across runs (fewer
# downloads, near-incremental rebuilds; cache-workspace-crates keeps the vendored boa
# artifacts too); npm downloads are cached the same way through setup-node's cache. The
# two Linux package formats are back to one compile each - each in its own floor
# container - because one binary cannot carry two glibc floors.
#
# The Linux installers are built in Docker containers whose base image IS the compatibility
# floor - the oldest distro that still has WebKitGTK 4.1, which Tauri 2 hard-requires
# (Ubuntu 20.04 only ships the 4.0 API and can never run the app):
#   ubuntu:22.04 -> deb (glibc 2.35): Ubuntu 22.04-26.04, Debian 12/13, Mint 21+,
#                   Pop!_OS 22.04+
#   fedora:38    -> rpm (glibc 2.37): Fedora 38+, openSUSE Leap 15.6+/Tumbleweed
# This is the pre-0.1.2 shape, restored: 0.1.2's deb was built natively on ubuntu-24.04,
# whose glibc 2.39 became a hard requirement (Rust std's weak pidfd_spawn / pidfd_getpid
# references turn into GLIBC_2.39 version entries at link time) that no Ubuntu 22.04 /
# Debian 12 machine could load. The costs that pushed CI to the native runner are paid
# differently now: buildx's GitHub cache keeps the image's apt layers warm across runs
# (the old path rebuilt them every run), and actions/cache warms the in-container compile
# through the /cache volume. The runner is ubuntu-latest on purpose - with containers the
# floor comes from the base image, not the runner, so a `latest` flip cannot move it (and
# the ubuntu-22.04 runner image retired 2026-09-17 anyway). The in-container pass fails
# the build if the binary ever asks for a newer glibc than its container's floor.
#
# Pull requests run the tests only; the installers build on push to main, on dispatch, and
# when release.yml calls this workflow with `studio-version` to stamp the version being
# published (`full` adds the niche macOS x64 platform).
#
# Which extension packages are packed INTO the installers is one policy everywhere
# (2026-09-28, the owner's direction): git-graph-rs rides in every build, claude-code
# in none by default — the Extensions view's marketplace row installs it on demand.
# The release form's checkboxes reach the build as
# GGS_BUNDLE_GIT_GRAPH / GGS_BUNDLE_CLAUDE_CODE
# (scripts/fetch-marketplace-extensions.mjs and scripts/prepare.mjs), and a pushed tag
# or a plain push to main takes the same defaults (`GGS_BUNDLE_CLAUDE_CODE=1` opts a
# build back in).

name: Studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Also build macOS x64'
        required: false
        default: false
        type: boolean
      studio-version:
        description: 'Version to stamp the build (empty = keep the sources version)'
        required: false
        default: ''
        type: string
      bundle-git-graph:
        description: 'Pack git-graph-rs into the installers'
        required: false
        default: true
        type: boolean
      bundle-claude-code:
        description: 'Pack claude-code into the installers'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      full:
        required: false
        default: false
        type: boolean
      studio-version:
        required: false
        default: ''
        type: string
      bundle-git-graph:
        required: false
        default: true
        type: boolean
      bundle-claude-code:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Incremental compilation only pays off within a single job and the caches below discard it
# anyway; turning it off speeds the clippy pass and shrinks the saved caches.
#
# Line-tables-only debuginfo for the dev/test compile (docs/ci-speed-plan.md P1 #4): MSVC
# PDB generation is a large share of the Windows test compile, and the full debuginfo the
# profile wrote was the bulk of the 12 GB that kept evicting every cache above GitHub's
# 10 GB line. Backtraces keep line numbers; dependencies carry no debuginfo at all
# ([profile.dev.package."*"] in src-tauri/Cargo.toml).
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: studio-${{ github.ref }}
  # Only PRs cancel their predecessor (docs/ci-speed-plan.md P1 #7): a cancelled run's
  # post steps never execute, so it saves no rust-cache — consecutive pushes to main each
  # paid a cold recompile where one of them completing would have landed the warm cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The app's frontend: typecheck plus the vitest suite from tests/, which runs against a
  # mocked Tauri backend (tests/tauriMock.ts), so neither Rust nor any extension package
  # is needed here.
  studio-test:
    name: Studio tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      # The remote workbench (docs/ggs-remote-plan.md §9.1): the same frontend with the Tauri
      # seam aliased onto the WebSocket shims — it must keep building.
      - name: Build the remote workbench
        run: npx vite build -c vite.remote.config.ts

  # The Windows backend test gate (docs/ci-speed-plan.md P2: tests and packaging are split
  # into parallel jobs — the wall clock is the max of the two, not the sum). This job owns
  # the dev/test compile; the installer job below never waits for it, and a calling
  # workflow (release.yml) still fails unless both sides passed. prepare runs --icons-only:
  # `generate_context!()` embeds the window icons at compile time, and that is ALL the test
  # compile needs — the ggs-node sidecar, the GGS Remote daemon and the marketplace fetch
  # are the installer build's business.
  test-windows:
    name: Studio backend tests (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 120
    if: github.event_name != 'pull_request'
    env:
      # As in the installer job below (see its comment): the tests' tempdirs on the D:
      # scratch, out of Defender's profile-temp scanning path.
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4

      # As in the installer job below (see its comment).
      - name: Exclude the build paths from Defender scanning
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup")
          foreach ($path in $paths) {
            try { Add-MpPreference -ExclusionPath $path } catch { Write-Host "skipped ${path}: $($_.Exception.Message)" }
          }

      # The pinned toolchain (rust-toolchain.toml); keep ref and file in sync on a bump.
      - uses: dtolnay/rust-toolchain@1.97.1
      # The dev/test half of the split cache: this job compiles only the dev profile, the
      # installer job below only release — one key each, so neither restores the other's
      # dead weight (the old shared key carried both halves and could not shed either).
      # cache-workspace-crates keeps the vendored boa path-dependency artifacts cached —
      # the default cleans local crates, which is why boa_engine recompiled in full on
      # every "full match" run (docs/ci-speed-plan.md P2).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../target/studio/cargo
          key: studio-windows-x64-test
          cache-on-failure: true
          cache-workspace-crates: true
          save-if: github.ref == 'refs/heads/main'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        run: npm ci || npm install

      # Sync the release version, as the installer jobs do: a release's tests compile the
      # same version string its installers stamp.
      - name: Stamp the release version
        if: inputs.studio-version != ''
        shell: bash
        env:
          STUDIO_VERSION: ${{ inputs.studio-version }}
        run: |
          VERSION="${STUDIO_VERSION#v}"
          npm pkg set version="$VERSION"
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = process.argv[1];
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            const cargo = 'src-tauri/Cargo.toml';
            fs.writeFileSync(cargo, fs.readFileSync(cargo, 'utf8').replace(/^version = \"[^\"]*\"/m, 'version = \"' + process.argv[1] + '\"'));
          " "$VERSION"

      # The icons generate_context!() embeds — the compile-time input of the test pass.
      - name: Prepare the compile-time icons
        run: node scripts/prepare.mjs --icons-only

      # rust-lld links the integration-test binary (it links the whole lib) markedly faster
      # than MSVC's link.exe; scoped to this job, the installer build keeps its linker.
      # --timings feeds the P0 baseline (uploaded below).
      - name: Test and lint the app backend
        working-directory: src-tauri
        env:
          GGS_PERF_FILES: '20000'
          RUSTFLAGS: -Clinker=rust-lld
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features --timings

      - name: Upload the cargo build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-windows-test-timings
          path: src-tauri/cargo-timings/**/*.html
          if-no-files-found: warn

  # The Linux backend test gate, native on the runner (the Windows job's sibling; the
  # container legs below only compile release for packaging — docs/ci-speed-plan.md P2).
  test-linux:
    name: Studio backend tests (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      # The pinned toolchain (rust-toolchain.toml); keep ref and file in sync on a bump.
      - uses: dtolnay/rust-toolchain@1.97.1
      # A fresh key of its own (the old studio-linux-native lineage mixed the dev and
      # release halves this split separates; one cold run retires it). cache-workspace-crates
      # as in the Windows test job: the vendored boa stays cached.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../target/studio/cargo
          key: studio-linux-native-test
          cache-on-failure: true
          cache-workspace-crates: true
          save-if: github.ref == 'refs/heads/main'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        run: npm ci || npm install

      - name: Stamp the release version
        if: inputs.studio-version != ''
        env:
          STUDIO_VERSION: ${{ inputs.studio-version }}
        run: |
          VERSION="${STUDIO_VERSION#v}"
          npm pkg set version="$VERSION"
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = process.argv[1];
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            const cargo = 'src-tauri/Cargo.toml';
            fs.writeFileSync(cargo, fs.readFileSync(cargo, 'utf8').replace(/^version = \"[^\"]*\"/m, 'version = \"' + process.argv[1] + '\"'));
          " "$VERSION"

      - name: Prepare the compile-time icons
        run: node scripts/prepare.mjs --icons-only

      - name: Test and lint the app backend
        working-directory: src-tauri
        env:
          GGS_PERF_FILES: '20000'
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          # --skip ggs_bash: the shell is a Windows-only sidecar (2026-10-14, the owner's
          # direction) — its suite runs in the Windows job alone.
          cargo test --all-features --timings -- --skip ggs_bash

      - name: Upload the cargo build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-linux-native-test-timings
          path: src-tauri/cargo-timings/**/*.html
          if-no-files-found: warn

  # The macOS backend test gate (the owner's direction, 2026-10-14: macOS tests too — the
  # suite had never run there, only Windows and Linux). One runner covers the platform:
  # the pty/watcher/tray surfaces differ per OS, not per arch. The ggs_bash suite's
  # Windows-specific tests are cfg(windows)-gated and the Unix half already passes on
  # Linux, so this is the same pass Linux runs; latent macOS-only failures surfacing
  # here is the job doing its work.
  test-macos:
    name: Studio backend tests (darwin-arm64)
    runs-on: macos-latest
    timeout-minutes: 90
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # The pinned toolchain (rust-toolchain.toml); keep ref and file in sync on a bump.
      - uses: dtolnay/rust-toolchain@1.97.1
      # The dev/test half of the split cache, as on the other platforms (see the Windows
      # test job's comment); cache-workspace-crates keeps the vendored boa warm.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../target/studio/cargo
          key: studio-darwin-arm64-test
          cache-on-failure: true
          cache-workspace-crates: true
          save-if: github.ref == 'refs/heads/main'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        run: npm ci || npm install

      - name: Stamp the release version
        if: inputs.studio-version != ''
        env:
          STUDIO_VERSION: ${{ inputs.studio-version }}
        run: |
          VERSION="${STUDIO_VERSION#v}"
          npm pkg set version="$VERSION"
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = process.argv[1];
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            const cargo = 'src-tauri/Cargo.toml';
            fs.writeFileSync(cargo, fs.readFileSync(cargo, 'utf8').replace(/^version = \"[^\"]*\"/m, 'version = \"' + process.argv[1] + '\"'));
          " "$VERSION"

      - name: Prepare the compile-time icons
        run: node scripts/prepare.mjs --icons-only

      - name: Test and lint the app backend
        working-directory: src-tauri
        env:
          GGS_PERF_FILES: '20000'
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          # --skip ggs_bash: the shell is a Windows-only sidecar (2026-10-14, the owner's
          # direction) — its suite runs in the Windows job alone.
          cargo test --all-features --timings -- --skip ggs_bash

      - name: Upload the cargo build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-darwin-test-timings
          path: src-tauri/cargo-timings/**/*.html
          if-no-files-found: warn

  # GGS Remote's daemon (extensions-src/ggs-remote/daemon, a crate of its own the app never
  # links): format, lint, and the unit + integration suites on all three platforms
  # (docs/ggs-remote-plan.md §15.6) — the tray backends differ per OS.
  remote-daemon-test:
    name: GGS Remote daemon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extensions-src/ggs-remote/daemon
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain (rust-toolchain.toml, docs/ci-speed-plan.md P1 #6); keep the
      # ref and the file in sync when bumping — a mismatch makes rustup install both.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extensions-src/ggs-remote/daemon -> ../../../target/studio/ggs-remote
          key: ggs-remote-daemon
          # Caches are saved from main only (docs/ci-speed-plan.md P1 #5): PR-branch saves
          # are what pushed the repo past the 10 GB eviction line; a PR still restores
          # main's cache, which is all it needs for a dependency-unchanged check run.
          save-if: github.ref == 'refs/heads/main'
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --target-dir ../../../target/studio/ggs-remote -- -D warnings
      - name: Test
        run: cargo test --target-dir ../../../target/studio/ggs-remote

  # The relay (extensions-src/ggs-remote/hub, another crate of its own, never inside the
  # VSIX): the server half of the tunnel protocol — one OS is enough, it has no tray
  # (docs/ggs-remote-plan.md §15.6, §20.8).
  remote-hub-test:
    name: GGS Remote hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions-src/ggs-remote/hub
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain (rust-toolchain.toml), as in every Rust job here.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extensions-src/ggs-remote/hub -> ../../../target/studio/ggs-remote-hub
          key: ggs-remote-hub
          save-if: github.ref == 'refs/heads/main'
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --target-dir ../../../target/studio/ggs-remote-hub -- -D warnings
      - name: Test
        run: cargo test --target-dir ../../../target/studio/ggs-remote-hub

  # The Windows installer (NSIS setup exe), built natively (the one Windows format:
  # tauri.conf.json's targets list carries no msi — 2026-10-14, the owner's direction).
  studio-windows:
    name: Studio installers (windows-x64)
    runs-on: windows-latest
    # A cold-cache run (first run after a Cargo.lock change) fits in ~2.5 h; fail fast on
    # a real hang instead of burning GitHub's 6 h default.
    timeout-minutes: 180
    if: github.event_name != 'pull_request'
    env:
      # The release form's checkboxes (see the header note): GGS_BUNDLE_* answers "is
      # this package packed into the installers" for every prepare.mjs run below.
      GGS_BUNDLE_GIT_GRAPH: ${{ inputs.bundle-git-graph == false && '0' || '1' }}
      GGS_BUNDLE_CLAUDE_CODE: ${{ inputs.bundle-claude-code == true && '1' || '0' }}
      # The build's scratch on the runner's D: drive, out of Defender's profile-temp
      # scanning path (see the test job's note for the original diagnosis).
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4

      # Defender's real-time scanning taxes every rustc/link write (docs/ci-speed-plan.md
      # P1 #3): exclude the workspace, the runner scratch and the cargo/rustup homes.
      # Best effort — a locked-down runner keeps scanning and merely runs slower; never
      # fail the build over it.
      - name: Exclude the build paths from Defender scanning
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup")
          foreach ($path in $paths) {
            try { Add-MpPreference -ExclusionPath $path } catch { Write-Host "skipped ${path}: $($_.Exception.Message)" }
          }

      # The pinned toolchain (rust-toolchain.toml); keep ref and file in sync on a bump.
      - uses: dtolnay/rust-toolchain@1.97.1
      # The release half of the split cache (the test job's comment tells the story);
      # -build is a fresh key because the old shared lineage mixed the dev and release
      # halves this split separates. The GGS Remote daemon's target rides along
      # (docs/ci-speed-plan.md P2): prepare.mjs compiles it release into
      # target/studio/ggs-remote — 4+ min cold on this runner. cache-workspace-crates
      # keeps the vendored boa artifacts cached (the default cleans local crates).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> ../target/studio/cargo
            extensions-src/ggs-remote/daemon -> ../../../target/studio/ggs-remote
          key: studio-windows-x64-build
          cache-on-failure: true
          cache-workspace-crates: true
          save-if: github.ref == 'refs/heads/main'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        run: npm ci || npm install

      # Release runs only: sync the app's version with the tag before anything reads it.
      # Stamped after `npm ci` so the lockfile check still sees the sources' version.
      # bash on every runner (Windows included) so the script is identical everywhere.
      - name: Stamp the release version
        if: inputs.studio-version != ''
        shell: bash
        env:
          STUDIO_VERSION: ${{ inputs.studio-version }}
        run: |
          VERSION="${STUDIO_VERSION#v}"
          npm pkg set version="$VERSION"
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = process.argv[1];
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            const cargo = 'src-tauri/Cargo.toml';
            fs.writeFileSync(cargo, fs.readFileSync(cargo, 'utf8').replace(/^version = \"[^\"]*\"/m, 'version = \"' + process.argv[1] + '\"'));
          " "$VERSION"

      # The tests run in their own parallel job (test-windows above): the dev/test
      # compile is not this job's to repeat, and a calling workflow fails unless that job
      # passed — the tests still gate every release. prepare.mjs itself runs as tauri
      # build's beforeBuildCommand below (full: sidecars, daemon, marketplace, --build).

      # Code signing from secrets, as in the macOS job: with WINDOWS_CERTIFICATE (base64
      # PFX) + its password the certificate is imported into the runner's user store and
      # the bundler Authenticode-signs the installers (SHA-256, RFC 3161 timestamp);
      # without them the merge file is an inert no-op and the installers build unsigned.
      - name: Wire the code signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $merge = @{ bundle = @{ windows = @{} } }
          if ($env:WINDOWS_CERTIFICATE -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'ggs-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            Write-Host "Imported $($certificate.Subject) ($($certificate.Thumbprint))"
            $merge.bundle.windows = @{
              certificateThumbprint = $certificate.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = 'http://timestamp.digicert.com'
            }
          } else {
            Write-Host 'No Windows signing secrets - building the installers unsigned'
          }
          New-Item -ItemType Directory -Force -Path target/studio | Out-Null
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'target/studio/signing.json'), ($merge | ConvertTo-Json -Depth 5))

      # The release dependency graph's per-crate timings (docs/ci-speed-plan.md P0): a
      # plain release build with the same profile and features `tauri build` uses, so the
      # installer build reuses everything this compiled — near-free on a warm cache, real
      # cold-start numbers otherwise, uploaded below either way.
      - name: Record the release build timings
        working-directory: src-tauri
        run: cargo build --release --timings

      - name: Build the installer (NSIS)
        run: npx tauri build --config target/studio/signing.json

      # Size and performance measurement (docs/ggs-development-plan.md M1.7; the budgets
      # were removed 2026-09-15 — sizes are recorded, not gated): the artefact sizes plus
      # the backend's headless probes on this repository itself. The metrics land in
      # target/studio/metrics.json and are published with the bundles. Continue-on-error
      # (docs/ci-speed-plan.md P1 #1): a wedged probe or boot-bench is recorded as absent
      # and never fails the installer build — sizes and installers still upload.
      - name: Measure sizes and performance
        continue-on-error: true
        run: node scripts/measure.mjs --repo .

      # The P0 baseline's build timings, uploaded even when a later step failed — that is
      # exactly when the numbers are wanted.
      - name: Upload the cargo build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-windows-timings
          path: src-tauri/cargo-timings/**/*.html
          if-no-files-found: warn

      # Only the installers themselves are artefacts: bundle/ also keeps each bundler's
      # work files, which must never reach the release page.
      - uses: actions/upload-artifact@v4
        with:
          name: studio-windows-x64
          path: |
            target/studio/cargo/release/bundle/nsis/*.exe
            target/studio/metrics.json
          if-no-files-found: error

  # The Linux installers, built in floor containers (see the header note): one pass per
  # package format, each on the oldest base that keeps the binary loadable on
  # still-supported distros of that family. The container fetches the marketplace
  # extension packages itself (through the repository mount's prepare.mjs run). The deb
  # leg also runs the backend test gate natively (the Windows job runs the same suite on
  # Windows); the rpm leg compiles the same sources inside its container, and a failed
  # workflow run never reaches release.yml.
  studio-linux:
    name: Studio installers (${{ matrix.artifact }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event_name != 'pull_request'
    env:
      # The release form's checkboxes, as in the Windows job (the deb leg's native
      # prepare and the container build read the same answer).
      GGS_BUNDLE_GIT_GRAPH: ${{ inputs.bundle-git-graph == false && '0' || '1' }}
      GGS_BUNDLE_CLAUDE_CODE: ${{ inputs.bundle-claude-code == true && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: ubuntu:22.04
            bundles: deb
            out: bundle-linux
            cache: linux-deb
            artifact: studio-linux-x64
          - base: fedora:38
            bundles: rpm
            out: bundle-rpm
            cache: linux-rpm
            artifact: studio-linux-rpm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        run: npm ci || npm install

      - name: Stamp the release version
        if: inputs.studio-version != ''
        env:
          STUDIO_VERSION: ${{ inputs.studio-version }}
        run: |
          VERSION="${STUDIO_VERSION#v}"
          npm pkg set version="$VERSION"
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = process.argv[1];
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            const cargo = 'src-tauri/Cargo.toml';
            fs.writeFileSync(cargo, fs.readFileSync(cargo, 'utf8').replace(/^version = \"[^\"]*\"/m, 'version = \"' + process.argv[1] + '\"'));
          " "$VERSION"

      # The Linux backend tests moved to their own parallel job (test-linux above): the
      # deb leg no longer compiles natively on the host — every compile this job pays is
      # the container's own release build, and a calling workflow still fails unless the
      # test job passed.

      # The container's cargo target and registries, cached across runs via the /cache
      # volume scripts/docker/studio-linux-build.sh redirects everything into.
      - name: Cache the container build
        uses: actions/cache@v4
        with:
          path: ~/.ggs-linux-cache
          key: studio-${{ matrix.cache }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: studio-${{ matrix.cache }}-

      # buildx with the GitHub cache keeps the image's apt layers warm across runs - the
      # cold rebuild of those layers every run is exactly why the container path was
      # abandoned on 2026-09-15. --load hands the built image to the docker run below.
      - name: Build the ${{ matrix.bundles }} installers in a ${{ matrix.base }} container
        run: |
          docker buildx create --name ggs-builder --driver docker-container --use
          docker buildx build \
            --build-arg BASE_IMAGE=${{ matrix.base }} \
            --cache-from type=gha,scope=studio-${{ matrix.cache }} \
            --cache-to type=gha,scope=studio-${{ matrix.cache }},mode=max \
            --load \
            -t ggs-linux-builder-${{ matrix.cache }} \
            -f scripts/docker/Dockerfile.studio-linux scripts/docker
          docker run --rm \
            -v "$PWD:/repo" \
            -v "$HOME/.ggs-linux-cache:/cache" \
            -e BUNDLES=${{ matrix.bundles }} \
            -e OUT_DIR=${{ matrix.out }} \
            -e GGS_REQUIRE_MARKETPLACE=1 \
            -e GGS_BUNDLE_GIT_GRAPH \
            -e GGS_BUNDLE_CLAUDE_CODE \
            ggs-linux-builder-${{ matrix.cache }} \
            bash /repo/scripts/docker/studio-linux-build.sh

      # Size measurement + backend probes (deb pass only - the rpm carries the same
      # binaries). measure.mjs expects the bundles under
      # target/studio/cargo/release/bundle/, so the deb pass's output is mirrored there
      # first; the probes run the container-built ggs binary itself. Continue-on-error as
      # in the Windows job: a wedged probe never fails the build.
      - name: Measure sizes and performance
        if: matrix.bundles == 'deb'
        continue-on-error: true
        run: |
          mkdir -p target/studio/cargo/release
          cp -r target/studio/bundle-linux target/studio/cargo/release/bundle
          node scripts/measure.mjs --repo .

      # Only the packages themselves are artefacts: beside each package the bundler leaves
      # its work tree (deb: control/, data.tar.gz, debian-binary, md5sums, the staged
      # binary and desktop file; rpm: the same under <name>-<version>-<arch>/), which must
      # never reach the release page.
      - uses: actions/upload-artifact@v4
        if: matrix.bundles == 'deb'
        with:
          name: ${{ matrix.artifact }}
          path: target/studio/bundle-linux/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.bundles == 'rpm'
        with:
          name: ${{ matrix.artifact }}
          path: target/studio/bundle-rpm/rpm/*.rpm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.bundles == 'deb'
        with:
          name: studio-linux-metrics
          path: target/studio/metrics.json
          # The measure step is continue-on-error; a metrics.json it never wrote must not
          # fail the build either.
          if-no-files-found: warn

  # The macOS installers (dmg), built natively; macOS x64 joins on a `full` run.
  studio-macos:
    name: Studio installers (${{ matrix.artifact }})
    if: github.event_name != 'pull_request'
    env:
      # The release form's checkboxes, as in the Windows job.
      GGS_BUNDLE_GIT_GRAPH: ${{ inputs.bundle-git-graph == false && '0' || '1' }}
      GGS_BUNDLE_CLAUDE_CODE: ${{ inputs.bundle-claude-code == true && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.full == true) && '[{"os":"macos-latest","artifact":"studio-darwin-arm64"},{"os":"macos-13","artifact":"studio-darwin-x64"}]' || '[{"os":"macos-latest","artifact":"studio-darwin-arm64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # The pinned toolchain (rust-toolchain.toml); keep ref and file in sync on a bump.
      - uses: dtolnay/rust-toolchain@1.97.1
      # Same target-dir mapping as the Windows build job, daemon target included (see its
      # comment) — prepare.mjs cold-compiles the daemon release here too (~2.5 min).
      # cache-workspace-crates keeps the vendored boa artifacts cached (the default
      # cleans local crates — see the test jobs' note).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> ../target/studio/cargo
            extensions-src/ggs-remote/daemon -> ../../../target/studio/ggs-remote
          key: studio-${{ matrix.artifact }}
          cache-on-failure: true
          cache-workspace-crates: true
          save-if: github.ref == 'refs/heads/main'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        run: npm ci || npm install

      - name: Stamp the release version
        if: inputs.studio-version != ''
        env:
          STUDIO_VERSION: ${{ inputs.studio-version }}
        run: |
          VERSION="${STUDIO_VERSION#v}"
          npm pkg set version="$VERSION"
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = process.argv[1];
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            const cargo = 'src-tauri/Cargo.toml';
            fs.writeFileSync(cargo, fs.readFileSync(cargo, 'utf8').replace(/^version = \"[^\"]*\"/m, 'version = \"' + process.argv[1] + '\"'));
          " "$VERSION"

      # Code signing is decided here, from secrets — never in the sources (see
      # scripts/signing.mjs, which writes the --config merge file the build reads). With
      # the Apple signing secrets the bundler imports the Developer ID certificate, signs
      # the bundle, notarizes and staples; without them the build still gets its ad-hoc
      # bundle seal — a macOS bundle with no signature of its own is assessed by
      # Gatekeeper as damaged (the un-bypassable verdict the 0.1.5 dmg shipped with),
      # a sealed ad-hoc one merely as unverified. Only non-empty credentials reach the
      # build: an env var set to "" reads as present to the bundler's detection.
      - name: Wire the code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: node scripts/signing.mjs macos

      - name: Build the installers (dmg)
        run: npx tauri build --config target/studio/signing.json

      # Continue-on-error as in the Windows job (docs/ci-speed-plan.md P1 #1): the macOS
      # boot-bench once paid its whole 3-minute-per-run quiet-machine waits too.
      - name: Measure sizes and performance
        continue-on-error: true
        run: node scripts/measure.mjs --repo .

      # Only the dmg is an artefact: bundle/dmg/ also keeps the create-dmg staging
      # (bundle_dmg.sh, template.applescript, eula-resources-template.xml, Info.plist,
      # icon.icns) and bundle/macos/ the raw .app, which must never reach the release page.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/studio/cargo/release/bundle/dmg/*.dmg
            target/studio/metrics.json
          if-no-files-found: error
