[package]
name = "git-graph-studio"
version = "0.1.11"
description = "Git Graph Studio - a standalone Git repository viewer with an explorer, source control panel, terminal and the git-graph-rs engine"
edition.workspace = true
# The floor is big-code-analysis (module 17's richer-metrics engine): it is Rust
# 2024 edition, which needs 1.94. Everything else in the tree builds below it.
rust-version.workspace = true
license.workspace = true
default-run = "git-graph-studio"

# The workspace root IS the app package (docs/architecture-restructure-plan.md §4.1): the
# tauri CLI, tauri.conf.json, generate_context!(), the vendored-boa [patch] table and every
# [profile.*] stay right here — [patch] and [profile] only take effect at the root, and the
# root has not moved. The plugin repository's own CI stays free of this workspace: it never
# builds here (its runners lack the WebKitGTK libraries a Tauri link needs).
[workspace]
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.94"
license = "MIT"
publish = false

# The lint baseline is CI's `cargo clippy --all-targets -- -D warnings` (the command line
# turns every warning into the failure); members opt in with `[lints] workspace = true` so
# a rule added here later reaches every crate at once.
[workspace.lints]

# One version and one default-feature set per dependency across the whole workspace
# (docs/architecture-restructure-plan.md §4.11): crates reference these with
# `dep = { workspace = true }`, so the tree can never grow two versions of the same crate
# by accident. Entries carry exactly the versions the app used before the split — this
# change moves them verbatim and changes no resolution.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
boa_engine = { version = "0.21", features = ["annex-b", "trace"] }
libloading = "0.8"
ureq = { version = "3", features = ["rustls"] }
sha1 = "0.10"
md-5 = "0.10"
sha2 = "0.10"
aes-gcm = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
bincode = "1.3"
if-addrs = "0.13"
getrandom = "0.2"
hex = "0.4"
ropey = "1.6"
rayon = "1"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
plist = { version = "1", default-features = false, features = ["serde"] }
fancy-regex = "0.16"
base64 = "0.22"
ignore = "0.4"
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
memchr = "2"
interprocess = { version = "2.2", features = ["tokio"] }
rmp-serde = "1.3"
serde_bytes = "0.11"
tokio = { version = "1", features = ["io-util", "sync", "time", "rt"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
trash = "5"
tempfile = "3"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
big-code-analysis = { version = "2.2", default-features = false }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-build = { version = "2", features = [] }
portable-pty = "0.9"
winreg = "0.52"
webview2-com = "0.38"
windows-core = "0.61"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem"] }
# The internal crates, one entry each (docs/architecture-restructure-plan.md §4.3) — a
# crate's entry lands in the same change the crate does.
ggs-base = { path = "crates/ggs-base" }
ggs-proto = { path = "crates/ggs-proto" }
ggs-codec = { path = "crates/ggs-codec" }
ggs-git = { path = "crates/ggs-git" }
ggs-shellenv = { path = "crates/ggs-shellenv" }
ggs-remote-proto = { path = "crates/ggs-remote-proto" }
ggs-config = { path = "crates/ggs-config" }

# The pretend Node runtime's parser, carrying one upstream gap fix: Boa's class-expression
# parser dropped a contextual-keyword name, so legal code real packages ship —
# `var e = class of extends Error {}`, claude-code's MaxBufferError — failed to parse
# (the class-declaration parser already had the branch; the expression parser missed it).
# The diff against the crates.io 0.21.1 source is one match arm in
# `src/parser/expression/primary/class_expression/mod.rs`, marked with a GGS patch
# comment; retire the vendored copy when upstream carries the fix.
[patch.crates-io]
# Features live in [dependencies] — a [patch] entry's "features" field is ignored
# (cargo warns about it), and the boa_engine dependency above already asks for "trace".
boa_parser = { path = "vendor/boa-parser" }
boa_ast = { path = "vendor/boa-ast" }
boa_engine = { path = "vendor/boa-engine" }
boa_gc = { path = "vendor/boa-gc" }

[lib]
name = "git_graph_studio_lib"
path = "src/lib.rs"

# The desktop app: needs the `desktop` feature (Tauri and everything that touches a window).
[[bin]]
name = "git-graph-studio"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
# Test-only surfaces: the `test_support` module and the `*_for_tests` hooks stay out of every
# shipped binary (docs/architecture-restructure-plan.md P1-4) — this crate's own tests get
# them through `cfg(test)`; an external test harness linking the lib turns this feature on.
# tempfile joins as an optional regular dependency so such a harness can build it.
testkit = ["dep:tempfile"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-clipboard-manager",
    "dep:portable-pty",
    "dep:ureq",
    "dep:sha1",
    "dep:hex",
    "dep:ropey",
    "dep:rayon",
    "dep:regex",
    "dep:zip",
    "dep:syntect",
    "dep:plist",
    "dep:fancy-regex",
    "dep:base64",
    "dep:ignore",
    "dep:notify",
    "dep:encoding_rs",
    "dep:trash",
    "dep:flate2",
    "dep:aes-gcm",
    "dep:getrandom",
    "dep:tree-sitter",
    "dep:big-code-analysis",
    "dep:interprocess",
    "dep:rmp-serde",
    "dep:serde_bytes",
    "dep:tokio",
    "dep:sha2",
    "grammar-rust",
    "grammar-python",
    "grammar-go",
    "grammar-javascript",
    "grammar-typescript",
    "grammar-java",
    "grammar-c",
    "grammar-cpp",
    "grammar-c-sharp",
]
# The tree-sitter grammars (plan §3.1: compiled with cc, the single sanctioned exception to
# the pure-Rust rule), one feature per language and all on by default through `desktop` —
# a build can shed a language by dropping its feature, and the parser layer (symbols/parse.rs)
# falls back to the outline scan for anything switched off. Each feature also forwards to
# big-code-analysis's same-language feature, so a shed language is shed in both engines.
grammar-rust = ["dep:tree-sitter-rust", "big-code-analysis/rust"]
grammar-python = ["dep:tree-sitter-python", "big-code-analysis/python"]
grammar-go = ["dep:tree-sitter-go", "big-code-analysis/go"]
grammar-javascript = ["dep:tree-sitter-javascript", "big-code-analysis/javascript"]
grammar-typescript = ["dep:tree-sitter-typescript", "big-code-analysis/typescript"]
grammar-java = ["dep:tree-sitter-java", "big-code-analysis/java"]
grammar-c = ["dep:tree-sitter-c", "big-code-analysis/c"]
grammar-cpp = ["dep:tree-sitter-cpp", "big-code-analysis/cpp"]
grammar-c-sharp = ["dep:tree-sitter-c-sharp", "big-code-analysis/csharp"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, optional = true }
tauri-plugin-dialog = { workspace = true, optional = true }
tauri-plugin-opener = { workspace = true, optional = true }
tauri-plugin-clipboard-manager = { workspace = true, optional = true }
# The L0 foundation every domain shares (paths, fsx, jsonc, workspace roots, cancel, sink).
ggs-base = { workspace = true }
# The ggs-ext/1 wire protocol (ext_process speaks it; ggs-node answers it).
ggs-proto = { workspace = true }
# The pure-Rust digests and archive codecs (GGS Bash's applets, ggs-config's zip reader).
ggs-codec = { workspace = true }
# The one git-CLI surface (locate today; the runner lands with P2-6).
ggs-git = { workspace = true }
# The Terminal Shell setting's outward environment (providers and pty read it).
ggs-shellenv = { workspace = true }
# The Remote Access control-channel messages (remote_host and the daemon share them).
ggs-remote-proto = { workspace = true }
# The one-command Remote Access setup CLI (the `ggs config` dispatch reaches it).
ggs-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rpassword = { workspace = true }
portable-pty = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# The ggs-node `crypto` builtin's cipher and KDF (aes-256-gcm seal/open, PBKDF2-HMAC-SHA256):
# pure Rust (RustCrypto), so the pretend-Node plan's no-C-bindings rule holds. Backs the
# natives `__ggsAesGcmSeal` / `__ggsAesGcmOpen` / `__ggsPbkdf2Sha256` that the prelude's
# `createCipheriv` / `createDecipheriv` / `pbkdf2Sync` wrap.
aes-gcm = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
# The AI provider store's key sealing (cmd_providers): AES-256-GCM, pure Rust (plan §3.1) —
# a provider's API key is encrypted at rest under a per-install master key and decrypted
# only when the bridged backend is spawned.
hex = { workspace = true, optional = true }
ropey = { workspace = true, optional = true }
# Quick Open's file list is walked across all cores instead of one (cmd_fs::walk_files).
rayon = { workspace = true, optional = true }
# The Search view's queries and Find References' word matching (cmd_search).
regex = { workspace = true, optional = true }
# The VSIX / .ggx readers and writers (cmd_ext): every archive this code writes picks
# Deflated, and OPC packages (VSIX) are Deflate/stored by specification, so the pure-Rust
# flate2 backend is the only codec linked — bzip2, zstd and xz (all C) stay out of the
# tree (plan §3.1). Nothing sets entry timestamps, so the `time` feature is off too.
# NOTE (docs/ci-speed-plan.md P3): dropping zopfli needs zip ≥ 3.0.0 — on the 2.x line
# `deflate-flate2` does not activate zip's own optional flate2 dependency (only the
# `deflate` umbrella's `flate2/rust_backend` does), so the leaner feature set does not
# compile. The 2→3 (or 4) upgrade is its own change.
zip = { workspace = true, optional = true }
# `default-fancy` swaps syntect's default Oniguruma (C) engine for the pure-Rust fancy-regex
# engine — the whole viewer stack stays free of C bindings.
syntect = { workspace = true, optional = true }
# The extension-grammar loader (ext_grammar.rs): reading a `.tmLanguage` plist (the JSON
# grammars go through serde_json directly).
plist = { workspace = true, optional = true }
# The viewer's whole-file find/replace (viewer/find.rs): the same engine syntect's
# `default-fancy` already pulls in, pinned to the tree's version so it costs nothing extra.
fancy-regex = { workspace = true, optional = true }
# Extension icons and README images cross the IPC bridge as base64 data URLs (cmd_ext).
base64 = { workspace = true, optional = true }
# The `.gitignore`-aware parallel tree walk (ripgrep's) behind Quick Open, the Search view
# and the symbol index (cmd_fs::walk_files) - uncapped, all cores.
ignore = { workspace = true, optional = true }
# Text encodings of the files the editor opens and saves (encoding.rs): BOMs, UTF-16,
# GB18030 / GBK, Shift_JIS, EUC-KR, Big5, Windows-1252.
encoding_rs = { workspace = true, optional = true }
# BLF log containers are zlib-compressed (can_log.rs).
flate2 = { workspace = true, optional = true }
# The .asc walker's newline scan (can_log.rs): SIMD-accelerated where std's byte-by-byte
# `position` is not; already in the tree via the `ignore` crate, so it costs nothing.
memchr = { workspace = true }
# Remote Access (module 19, remote_host.rs): the local control channel to the GGS Remote
# daemon — a named pipe (Windows) or a Unix socket, over Tauri's own tokio runtime — and its
# MessagePack messages (the daemon keeps its own copy; shared test vectors align the two).
interprocess = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# The file-system watcher behind "external changes show up by themselves" (watcher.rs).
notify = { workspace = true, optional = true }
trash = { workspace = true, optional = true }
# The testkit feature's scratch directories (test_support): optional as a regular
# dependency so an external test harness enabling `testkit` can build it; this crate's
# own tests get it through [dev-dependencies] below.
tempfile = { workspace = true, optional = true }
# The tree-sitter parser layer (plan M4.1, symbols/parse.rs): the core runtime plus one
# grammar crate per language, each behind its `grammar-*` feature. On the 0.26 line because
# big-code-analysis (below) is compiled against it — one core for both engines. The grammar
# crates bind through the ABI-neutral `tree-sitter-language` crate, so they do not semver-
# couple to the core.
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
# The richer-metrics engine behind Complexity & Hotspots (module 17, analysis/bca.rs): the
# rust-code-analysis fork, computing cognitive complexity, Halstead, logical SLOC and the
# maintainability index per function at report time. `default-features = false` keeps to the
# grammar-* languages (no 23-grammar `all-languages`); `vcs` (its gitoxide churn metrics)
# stays off — the engine's own gix version is not for churn here. Pure Rust beyond the
# sanctioned tree-sitter grammars. Rust 2024 edition, hence the 1.94 rust-version floor.
big-code-analysis = { workspace = true, optional = true }

# The File Associations service (cmd_assoc): per-user ProgIds and the
# RegisteredApplications entry under HKCU.
[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
# Remote Access's replica (remote_host::emulate_focus): the hidden desktop window's page
# keeps believing it has the focus through WebView2's DevTools protocol. The versions are
# the ones wry already builds (one copy each).
webview2-com = { workspace = true }
windows-core = { workspace = true }

# The probe runs' App Nap guard (lib.rs's GGS_DEV_HARNESS hook): an occluded macOS
# WKWebView stops firing page timers, so the dev harness's bounded waits stall for
# wall-clock minutes. objc2-foundation is already in the tree via arboard; the same
# version keeps one copy. objc2/objc2-app-kit (the Dock menu's NSMenu injection,
# cmd_app::dock_menu) are the same story via wry.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }

[dev-dependencies]
# The performance test's raw parallel read baseline (rayon is optional for the app itself).
rayon = { workspace = true }
# The test suites' scratch directories (can_log, cmd_search, cmd_analysis, measure's own
# tests). The runtime code builds its own tiny scratch dir instead (measure.rs's
# ScratchDir) — tempfile is test-only, so no binary linking the lib carries it
# (docs/ci-speed-plan.md P3: one less crate, its fastrand/getrandom included).
tempfile = { workspace = true }

# `tauri dev` builds here, and the CAN log walker crunches hundreds of MB/s of text:
# opt-level 1 keeps incremental builds quick while making the parse loops an order of
# magnitude faster than the unoptimised default (release stays the size-diet profile below).
[profile.dev]
opt-level = 1

# Dependencies carry no debuginfo in dev/test builds (docs/ci-speed-plan.md P1 #4): MSVC
# PDB generation is a large share of the CI test compile, and the full dependency
# debuginfo was the bulk of what pushed the rust-caches past GitHub's 10 GB eviction
# line. The workspace's own crates keep their debuginfo locally (CI narrows them to
# line-tables-only through CARGO_PROFILE_DEV_DEBUG there) — stepping into dependency
# frames was never a supported workflow.
[profile.dev.package."*"]
debug = false

# The size diet (docs/ggs-development-plan.md M1.2): the app is its own workspace, so it does
# not inherit the plugin workspace's release profile. Size-optimised, fat LTO, one codegen
# unit, aborting panics, stripped - about 40% smaller than the default release profile.
#
# `panic = "abort"` is deliberate and stays: test targets are always built with unwinding,
# so CI runs its tests in the dev profile and the dependency graph is compiled twice there
# (dev for the tests, release for the installers). Sharing one compile is impossible while
# this setting exists - dropping it to enable that was rejected (verified experimentally,
# 2026-09-15; see .github/workflows/studio.yml).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# The `ggs-node` sidecar builds on the release profile (fat LTO, one codegen unit,
# stripped) but optimizes for speed, and it keeps unwinding panics: it runs
# third-party JS, and a miscompiled closure (Boa's known `Function`-constructor compile
# bug) must degrade its own initialization — the VM's `PutLexicalValue` degrades under
# `catch_unwind` — instead of aborting the whole backend mid-handshake.
[profile.ggs-node]
inherits = "release"
panic = "unwind"
# Speed, not size: the sidecar's job is parsing, compiling and interpreting megabytes of
# third-party JS, and at "z" Boa's parser and VM ran ~25% slower (the size budgets that
# motivated "z" were removed, 2026-09-15).
opt-level = 3
