[package]
name = "ggs-fs"
version = "0.0.0"
description = "The workspace file services — listing, chunked reads, the no-clobber copy engine, the streaming transfer engine, confined uploads, zip_tree and the shared tree walk"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ggs-base.workspace = true
ggs-text.workspace = true
serde.workspace = true
serde_json.workspace = true
# The `.gitignore`-aware parallel tree walk (ripgrep's) behind Quick Open, the Search
# view and the symbol index.
ignore.workspace = true
rayon.workspace = true
# delete_path's Recycle Bin default.
trash.workspace = true
zip = { workspace = true }
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
