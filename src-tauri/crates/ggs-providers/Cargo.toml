[package]
name = "ggs-providers"
version = "0.0.0"
description = "The AI provider bridge's engine — the sealed provider store (~/.ggs/ai-providers.json, AES-256-GCM under a master key derived from the machine's identity), the presets, the per-window choice, the spawn environment the bridged backend inherits, the gateway probes, the cc-switch import, the usage aggregation and the Claude MCP integration writes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ggs-base.workspace = true
# The Terminal Shell preference's half of the bridged environment.
ggs-shellenv.workspace = true
# The Git Bash choice resolves Git for Windows' bash through the same locator the
# terminal uses (plan §4.3: a same-layer edge, listed for this reason).
ggs-git.workspace = true
serde.workspace = true
serde_json.workspace = true
# The API-key sealing (AES-256-GCM under a master key derived from the machine's
# identity — 2026-11-16, the owner's direction: the store copied to another PC must
# not decrypt, `keys/ai-providers.key` carried along included).
aes-gcm.workspace = true
sha2.workspace = true
getrandom.workspace = true
base64.workspace = true
# The gateway probes (Test Connection, Fetch Models) and their bounded timeouts.
ureq = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The OS install's MachineGuid — the machine identity the master key derives from.
winreg.workspace = true

[dev-dependencies]
tempfile.workspace = true
