[package]
name = "ggs-text"
version = "0.0.0"
description = "The text engine — encodings, the rope document with highlight checkpoints, find/replace, the indexed viewer, the probe and editor backups"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ggs-base.workspace = true
serde.workspace = true
serde_json.workspace = true
ropey.workspace = true
# `default-fancy` swaps syntect's Oniguruma (C) engine for the pure-Rust fancy-regex
# engine — the whole viewer stack stays free of C bindings (plan §3.1).
syntect = { workspace = true }
fancy-regex = { workspace = true }
encoding_rs = { workspace = true }
memchr.workspace = true
rayon.workspace = true
plist = { workspace = true }
sha1.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile.workspace = true
